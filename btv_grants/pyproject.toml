[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "btv-grants"
version = "1.0.0"
description = "BuildToValue Grant Decision Adapter — ethical governance pipeline for blockchain grant proposals"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # buildtovalue SDK is an optional runtime dependency.
    # When absent, the adapter runs in stub mode (tests only).
    # Pin to exact version to ensure Verdict model compatibility.
    # "buildtovalue>=3.0.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.9",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["btv_grants"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "UP", "ANN", "S", "B", "C4", "PT"]
ignore = [
    "ANN101",  # Missing self annotation
    "ANN102",  # Missing cls annotation
    "S101",    # Use of assert (allowed in tests)
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["btv_grants"]
branch = true

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
