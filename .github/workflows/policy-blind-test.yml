name: Rawls Blind Policy Testing (ADR-042)

on:
  push:
    paths:
      - 'data/policies/**/*.yaml'
      - 'python/buildtovalue/governance/policy_tester.py'
      - 'python/buildtovalue/governance/synthetic_dataset.py'
  # ADR-042: bloquear PRs que toquem policies ou código de teste antes de merge
  pull_request:
    paths:
      - 'data/policies/**/*.yaml'
      - 'python/buildtovalue/governance/policy_tester.py'
      - 'python/buildtovalue/governance/synthetic_dataset.py'
      - 'python/buildtovalue/governance/blind_evaluator.py'
  workflow_dispatch:
    inputs:
      force_rerun:
        description: 'Forçar re-execução mesmo sem mudança de epoch'
        default: 'false'
        type: boolean

jobs:
  blind-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: blind-test-${{ runner.os }}-${{ hashFiles('rust/**/Cargo.lock') }}
          restore-keys: |
            bindings-${{ runner.os }}-${{ hashFiles('rust/**/Cargo.lock') }}
            blind-test-${{ runner.os }}-

      - name: Build and install PyO3 bindings
        run: |
          pip install maturin
          # Remove stale wheels from cargo cache (may be built for a different
          # Python version than the one active in this CI job).
          rm -f rust/target/wheels/*.whl
          cd rust && maturin build --release -m bindings/Cargo.toml && pip install target/wheels/*.whl
          echo "  OK: buildtovalue_kernel installed"

      - name: Install dependencies
        run: pip install -e "python/[dev]"

      - name: Start governance service
        run: |
          BTV_HMAC_KEY="${BTV_HMAC_KEY:-ci-blind-test-key-padded-to-32bytes}" \
          BTV_POLICY_DIR="data/policies" \
          BTV_DB_PATH="/tmp/ci-trust.db" \
          BTV_APPEALS_DB="/tmp/ci-appeals.db" \
          BTV_THREATS_DB="/tmp/ci-threats.db" \
          BTV_ADMIN_PASSWORD="${BTV_ADMIN_PASSWORD:-ci-blind-admin-password-2026}" \
            python -m uvicorn buildtovalue.api.app:app \
              --host 127.0.0.1 --port 8000 --log-level warning &
          echo "Aguardando governance /health..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "  ✅ Governance pronto (${i}s)"
              break
            fi
            [ "$i" -eq 30 ] && { echo "  ❌ Timeout — governance não respondeu"; exit 1; }
            sleep 1
          done
        env:
          BTV_HMAC_KEY: ${{ secrets.BTV_HMAC_KEY || 'ci-blind-test-key-padded-to-32bytes' }}

      - name: Fetch current PatternRegistry epoch
        id: epoch
        run: |
          EPOCH=$(python -c "
          from buildtovalue.governance.pattern_registry_client import get_current_epoch
          print(get_current_epoch())
          ")
          echo "epoch=$EPOCH" >> $GITHUB_OUTPUT
          echo "Epoch atual: $EPOCH"
        env:
          BTV_PATTERN_EPOCH: "0"

      - name: Run Blind Policy Tests (Equity Gate >= 95% por grupo)
        run: |
          FAILED=0
          for policy in data/policies/**/*.yaml; do
            echo "--- Testando: $policy ---"
            policy_id=$(basename "${policy%.yaml}")
            python -m buildtovalue.governance.policy_tester_runner \
              --policy "$policy" \
              --epoch-file "/tmp/epoch_${policy_id}.json" \
              --fail-on-gate-fail \
              --cases 200 \
              --gateway "http://localhost:8000" \
              --output "/tmp/report_${policy_id}.json" \
            || FAILED=$((FAILED + 1))
          done
          if [ $FAILED -gt 0 ]; then
            echo "❌ $FAILED policy(ies) falharam no equity gate"
            exit 1
          fi
        env:
          BTV_PATTERN_EPOCH: ${{ steps.epoch.outputs.epoch }}
          BTV_HMAC_KEY:      ${{ secrets.BTV_HMAC_KEY || 'ci-blind-test-key-padded-to-32bytes' }}

      - name: Upload relatórios como artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-test-reports-epoch-${{ steps.epoch.outputs.epoch }}
          path: /tmp/report_*.json
          retention-days: 90
