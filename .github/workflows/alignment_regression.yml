name: alignment_regression

on:
  push:
    paths:
      - "data/policies/model_registry.yaml"
      - "python/tests/unit/alignment/**"
      - ".github/workflows/alignment_regression.yml"
  pull_request:
    paths:
      - "data/policies/model_registry.yaml"
      - "python/tests/unit/alignment/**"
      - ".github/workflows/alignment_regression.yml"
  workflow_dispatch: {}

jobs:
  golden_tests:
    name: Alignment Golden Suite (PROP-035)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pyyaml
          if [ -f python/requirements.txt ]; then pip install -r python/requirements.txt; fi
          if [ -f python/requirements-dev.txt ]; then pip install -r python/requirements-dev.txt; fi

      - name: Run alignment golden tests
        run: |
          cd python
          python -m pytest -q tests/unit/alignment/test_alignment_golden.py

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: alignment-regression-failure
          path: python/.pytest_cache/
