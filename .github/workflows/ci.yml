name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

env:
  CARGO_TERM_COLOR: always
  BTV_HMAC_KEY: "ci-test-key-not-for-production!!"
  BTV_ENV: development

jobs:
  rust:
    name: Rust Kernel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Build
        run: cargo build --workspace

      - name: Tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Crate boundary audit
        run: |
          # btv-types must not depend on kernel or btv-core
          if cargo tree -p btv-types 2>/dev/null | grep -E "buildtovalue-kernel|btv-core"; then
            echo "ERROR: btv-types must not depend on kernel or btv-core"
            exit 1
          fi
          echo "btv-types boundary: OK"
          # btv-core must not depend on kernel
          if cargo tree -p btv-core 2>/dev/null | grep "buildtovalue-kernel"; then
            echo "ERROR: btv-core must not depend on buildtovalue-kernel"
            exit 1
          fi
          echo "btv-core boundary: OK"

  python:
    name: Python Governance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest tests/ -v --tb=short

  ethical:
    name: Ethical Tests
    runs-on: ubuntu-latest
    needs: python
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ethical Committee
        run: python -m pytest tests/ethical/ -v --tb=short

  mypy:
    name: Python Type Check (mypy --strict)
    runs-on: ubuntu-latest
    needs: python
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      # ADR-036: mypy --strict para o pacote governance/ (0.4 dívida técnica)
      - name: Type check governance package
        run: python -m mypy buildtovalue/governance/ --strict --ignore-missing-imports

  policy-regression:
    name: Policy Regression (ADR-042 fast path)
    runs-on: ubuntu-latest
    needs: python
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      # ADR-042: fast path com 50 cases — bloqueia PR se equity gate < 95%
      - name: Policy regression (fast, 50 cases per policy)
        run: |
          FAILED=0
          for policy in ../data/policies/*.yaml; do
            echo "--- Policy regression: $policy ---"
            python -m buildtovalue.governance.policy_tester_runner \
              --policy "$policy" \
              --fail-on-gate-fail \
              --cases 50 \
              --output "/tmp/ci_report_$(basename $policy .yaml).json" \
            || FAILED=$((FAILED + 1))
          done
          if [ $FAILED -gt 0 ]; then
            echo "❌ $FAILED policy(ies) falharam no equity gate (CI fast path)"
            exit 1
          fi
        env:
          BTV_HMAC_KEY: ${{ env.BTV_HMAC_KEY }}