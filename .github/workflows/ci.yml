# =============================================================================
# BuildToValue Grant Decision Adapter — CI Pipeline
# =============================================================================
# Validates all deliverables from Weeks 1-4 of the 3-month execution plan.
#
# Jobs:
#   week1-core       — Adapter structural invariants (fail-secure, HMAC-SHA256,
#                       JSON minified, GrantBlockedError fields)
#   week2-policy-adr — YAML policy parseability, ADR-043 completeness,
#                       BiasDeclaration Jonas enforcement
#   week3-test-cases — 800 adversarial cases: count, categories, linguistic
#                       groups, ground-truth coverage, schema compliance
#   week4-runner     — Runner CLI, dry-run, unit tests, dataset schema v7
#   full-pipeline    — Sequential gate: all weeks must pass
#
# Triggers:
#   push to main, pull_request, manual dispatch
# =============================================================================

name: Grant Adapter CI — Weeks 1-4

on:
  push:
    branches: [main, develop, "feat/grant-adapter-*"]
    paths:
      - "sdk/integrations/grants/**"
      - "data/policies/sectors/**"
      - "docs/adr/0057-grant-decision-adapter.md"
      - "tests/**"
      - ".github/workflows/ci.yml"
      - "scripts/ci/ci_week*.py"
      - "Makefile"
  pull_request:
    branches: [main]
    paths:
      - "sdk/integrations/grants/**"
      - "data/policies/sectors/**"
      - "docs/adr/0057-grant-decision-adapter.md"
      - "tests/**"
      - ".github/workflows/ci.yml"
      - "scripts/ci/ci_week*.py"
  workflow_dispatch:
    inputs:
      week_filter:
        description: "Run specific week (1-4) or 'all'"
        required: false
        default: "all"
        type: choice
        options: ["1", "2", "3", "4", "all"]

env:
  PYTHON_VERSION: "3.12"
  PROJECT_ROOT: ${{ github.workspace }}
  GRANT_ADAPTER_DIR: "sdk/integrations/grants/btv_grants"
  POLICY_DIR: "data/policies/sectors"
  TEST_DIR: "tests"

jobs:
  # =========================================================================
  # WEEK 1 — Adapter Core Invariants
  # =========================================================================
  week1-core:
    name: "Week 1 — Adapter Core"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event.inputs.week_filter == 'all' ||
      github.event.inputs.week_filter == '1' ||
      github.event.inputs.week_filter == ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: "W1.1 — File existence check"
        run: |
          echo "::group::File Existence"
          FILES=(
            "sdk/integrations/grants/btv_grants/__init__.py"
            "sdk/integrations/grants/btv_grants/adapter.py"
            "sdk/integrations/grants/btv_grants/models.py"
            "sdk/integrations/grants/btv_grants/exceptions.py"
          )
          MISSING=0
          for f in "${FILES[@]}"; do
            if [ -f "$f" ]; then
              echo "  ✅ $f"
            else
              echo "  ❌ $f — MISSING"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "::error::$MISSING file(s) missing"
            exit 1
          fi
          echo "::endgroup::"

      - name: "W1.2 — Module imports"
        run: |
          echo "::group::Module Imports"
          cd sdk/integrations/grants
          python -c "
          import sys
          # Aponta para sdk/integrations/grants/ — pai de btv_grants/
          # Isso permite que relative imports dentro de adapter.py funcionem
          sys.path.insert(0, '.')
          from btv_grants.exceptions import (
              GrantBlockedError, GrantValidationError,
              GrantSanitizationError, BiasDeclarationError,
          )
          print('  ✅ exceptions — all 4 exception classes')
          from btv_grants.models import (
              GrantProposal, GrantCategory, GrantStage, LinguisticGroup,
              ActionImpact, BiasDeclaration, DEFAULT_BIAS_DECLARATIONS,
          )
          print('  ✅ models — all 7 classes + 1 constant')
          from btv_grants.adapter import GrantGuard, GrantGuardConfig
          print('  ✅ adapter — GrantGuard + GrantGuardConfig')
          from btv_grants import (
              GrantGuard, GrantGuardConfig,
              GrantProposal, GrantCategory, GrantStage, LinguisticGroup,
              ActionImpact, BiasDeclaration, DEFAULT_BIAS_DECLARATIONS,
              GrantBlockedError, GrantValidationError,
              GrantSanitizationError, BiasDeclarationError,
          )
          print('  ✅ __init__.py — all 13 public symbols')
          print()
          print('All imports successful')
          "
          echo "::endgroup::"

      - name: "W1.3 — HMAC-SHA256 invariant (no BLAKE3)"
        run: |
          echo "::group::HMAC-SHA256 Invariant"
          cd sdk/integrations/grants
          python -c "
          import sys
          sys.path.insert(0, '.')
          from btv_grants.models import GrantProposal, GrantCategory
          p = GrantProposal(
              applicant_id='0xhmac-test',
              title='HMAC Test',
              description='Testing session ID derivation',
              category=GrantCategory.OTHER,
          )
          sid = p.to_session_id()
          assert len(sid) == 64, f'Expected 64 chars, got {len(sid)}'
          print(f'  ✅ Session ID length: {len(sid)} (SHA-256)')
          int(sid, 16)
          print(f'  ✅ Session ID is valid hex')
          sid2 = p.to_session_id()
          assert sid == sid2, 'Non-deterministic session ID!'
          print(f'  ✅ Deterministic: same input → same output')
          sid3 = p.to_session_id(secret=b'different-salt')
          assert sid != sid3, 'Salt rotation has no effect!'
          print(f'  ✅ Salt rotation: different salt → different output')
          source = open('btv_grants/models.py').read()
          assert 'blake3' not in source.lower(), 'BLAKE3 found in models.py!'
          print(f'  ✅ No BLAKE3 in models.py (kernel handles it)')
          source2 = open('btv_grants/adapter.py').read()
          assert 'blake3' not in source2.lower(), 'BLAKE3 found in adapter.py!'
          print(f'  ✅ No BLAKE3 in adapter.py')
          print()
          print('HMAC-SHA256 invariant: PASS')
          "
          echo "::endgroup::"

      - name: "W1.4 — JSON minified invariant (no English prefixes)"
        run: |
          echo "::group::JSON Minified Invariant"
          cd sdk/integrations/grants
          python -c "
          import sys, json
          sys.path.insert(0, '.')
          from btv_grants.models import GrantProposal, GrantCategory, LinguisticGroup
          proposals = [
              ('pt-BR', 'Monitoramento Ambiental', 'Sensoriamento para a Amazônia'),
              ('es', 'Identidad Descentralizada', 'Plataforma soberana en Ethereum'),
              ('sw', 'Mradi wa Maji', 'Ukusafisha maji kwa jamii'),
          ]
          for lang, title, desc in proposals:
              lg = {'pt-BR': LinguisticGroup.PT_BR, 'es': LinguisticGroup.ES, 'sw': LinguisticGroup.SW}[lang]
              p = GrantProposal(
                  applicant_id=f'0x{lang}', title=title, description=desc,
                  category=GrantCategory.PUBLIC_GOODS, linguistic_group=lg,
              )
              raw = p.to_btv_input()
              parsed = json.loads(raw)
              assert parsed['title'] == title
              assert parsed['description'] == desc
              assert 'Title:' not in raw
              assert 'Description:' not in raw
              assert '  ' not in raw
              print(f'  ✅ [{lang}] JSON valid, no prefixes, compact')
          print()
          print('JSON minified invariant: PASS')
          "
          echo "::endgroup::"

      - name: "W1.5 — GrantBlockedError has contestable + appeal_deadline_hours"
        run: |
          echo "::group::GrantBlockedError Fields"
          cd sdk/integrations/grants
          python -c "
          import sys
          sys.path.insert(0, '.')
          from btv_grants.exceptions import GrantBlockedError
          err = GrantBlockedError(
              verdict_id='VRD-CITEST01', action='BLOCK', rationale='Test rationale',
              contestable=True, appeal_deadline_hours=168, composite_risk=0.75,
              trust_score=0.8, mercy_applied=False,
          )
          assert err.contestable is True
          assert err.appeal_deadline_hours == 168
          assert err.composite_risk == 0.75
          assert err.trust_score == 0.8
          msg = str(err)
          assert 'Contestable: YES' in msg
          assert '168h' in msg
          err_hard = GrantBlockedError(
              verdict_id='VRD-HARDCI01', action='BLOCK', rationale='Hard blocked',
              contestable=False, appeal_deadline_hours=0,
          )
          msg_hard = str(err_hard)
          assert 'Contestable: NO' in msg_hard
          assert 'no appeal pathway' in msg_hard
          print('  ✅ GrantBlockedError invariant: PASS')
          "
          echo "::endgroup::"

      - name: "W1.6 — hard_blocked checked BEFORE action (fail-secure)"
        run: |
          echo "::group::Fail-Secure Priority"
          cd sdk/integrations/grants
          python -c "
          source = open('btv_grants/adapter.py').read()
          hard_block_pos = source.find('verdict.hard_blocked')
          action_check_pos = source.find('action_str in self._config.block_on')
          assert hard_block_pos > 0, 'hard_blocked check not found!'
          assert action_check_pos > 0, 'action check not found!'
          assert hard_block_pos < action_check_pos, (
              f'FAIL-SAFE VIOLATION: hard_blocked ({hard_block_pos}) >= action ({action_check_pos})'
          )
          print(f'  ✅ hard_blocked ({hard_block_pos}) < action ({action_check_pos})')
          method_source = source[source.find('def evaluate('):source.find('def evaluate_batch(')]
          for step in ['_validate(proposal)','_sanitize(proposal)','to_btv_input()','to_session_id(','client.decide(','verdict.hard_blocked']:
              assert step in method_source, f'Missing: {step}'
              print(f'  ✅ Pipeline step: {step}')
          print()
          print('Fail-secure invariant: PASS')
          "
          echo "::endgroup::"

      - name: "W1.7 — use_decide=True as default (ADR-043 §1)"
        run: |
          echo "::group::use_decide Default"
          cd sdk/integrations/grants
          python -c "
          import sys
          sys.path.insert(0, '.')
          from btv_grants.adapter import GrantGuardConfig
          config = GrantGuardConfig()
          assert config.use_decide is True
          config2 = GrantGuardConfig(use_decide=False)
          assert config2.use_decide is False
          print('  ✅ use_decide=True default, overridable')
          "
          echo "::endgroup::"

      - name: "W1.8 — BiasDeclaration Jonas integrity (sw=null)"
        run: |
          echo "::group::BiasDeclaration Jonas Enforcement"
          cd sdk/integrations/grants
          python -c "
          import sys
          sys.path.insert(0, '.')
          from btv_grants.models import BiasDeclaration, LinguisticGroup, DEFAULT_BIAS_DECLARATIONS
          bd = BiasDeclaration(group=LinguisticGroup.SW)
          assert bd.fpr is None and bd.fnr is None
          print(f'  ✅ sw: fpr={bd.fpr}, fnr={bd.fnr} (null — valid)')
          try:
              BiasDeclaration(group=LinguisticGroup.SW, fpr=0.05)
              sys.exit(1)
          except ValueError as e:
              assert 'Jonas' in str(e)
              print(f'  ✅ sw: fpr=0.05 → ValueError (Jonas principle)')
          try:
              BiasDeclaration(group=LinguisticGroup.SW, fnr=0.10)
              sys.exit(1)
          except ValueError as e:
              assert 'Jonas' in str(e)
              print(f'  ✅ sw: fnr=0.10 → ValueError (Jonas principle)')
          bd_en = BiasDeclaration(group=LinguisticGroup.EN_US, fpr=0.03, fnr=0.05)
          assert bd_en.fpr == 0.03
          print(f'  ✅ en-US: fpr={bd_en.fpr} (valid)')
          try:
              BiasDeclaration(group=LinguisticGroup.EN_US, fpr=1.5)
              sys.exit(1)
          except ValueError:
              print(f'  ✅ FPR > 1.0 → ValueError')
          try:
              BiasDeclaration(group=LinguisticGroup.EN_US, fnr=-0.1)
              sys.exit(1)
          except ValueError:
              print(f'  ✅ FNR < 0.0 → ValueError')
          for lg in [LinguisticGroup.EN_US, LinguisticGroup.PT_BR, LinguisticGroup.ES, LinguisticGroup.SW]:
              assert lg in DEFAULT_BIAS_DECLARATIONS
          print(f'  ✅ DEFAULT_BIAS_DECLARATIONS has all 4 groups')
          sw_bd = DEFAULT_BIAS_DECLARATIONS[LinguisticGroup.SW]
          assert sw_bd.fpr is None and sw_bd.fnr is None and sw_bd.sample_size == 0
          print(f'  ✅ DEFAULT sw: null, sample_size=0')
          print()
          print('BiasDeclaration Jonas invariant: PASS')
          "
          echo "::endgroup::"

  # =========================================================================
  # WEEK 2 — Policy + ADR
  # =========================================================================
  week2-policy-adr:
    name: "Week 2 — Policy + ADR"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event.inputs.week_filter == 'all' ||
      github.event.inputs.week_filter == '2' ||
      github.event.inputs.week_filter == ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: "W2.1 — Policy file location"
        run: |
          POLICY="data/policies/sectors/grant-eligibility-v1.yaml"
          if [ -f "$POLICY" ]; then echo "  ✅ $POLICY"; else echo "  ❌ $POLICY missing"; exit 1; fi
          if [ -f "data/policies/grant-eligibility-v1.yaml" ]; then echo "  ❌ Wrong location!"; exit 1; fi
          echo "  ✅ Not in wrong location"

      - name: "W2.2 — YAML parseability"
        run: |
          python3 -c "
          import yaml, sys
          with open('data/policies/sectors/grant-eligibility-v1.yaml') as f:
              policy = yaml.safe_load(f)
          assert isinstance(policy, dict)
          required = ['metadata','jurisdiction','financial','thresholds','actions','rawls','levinas','jonas','gilligan','categories']
          missing = [s for s in required if s not in policy]
          if missing: print(f'  ❌ Missing: {missing}'); sys.exit(1)
          print(f'  ✅ All {len(required)} sections present')
          "

      - name: "W2.3 — Metadata completeness"
        run: |
          python3 -c "
          import yaml, sys, re
          from datetime import datetime
          with open('data/policies/sectors/grant-eligibility-v1.yaml') as f:
              policy = yaml.safe_load(f)
          meta = policy['metadata']
          for field in ['policy_id','name','version','sector','created','expires','author','description']:
              assert field in meta, f'Missing: {field}'
          assert re.match(r'\d+\.\d+\.\d+', meta['version'])
          c = datetime.fromisoformat(meta['created'].replace('Z','+00:00'))
          e = datetime.fromisoformat(meta['expires'].replace('Z','+00:00'))
          assert (e-c).days == 90, f'Expected 90d, got {(e-c).days}'
          assert meta['sector'] == 'grants'
          print('  ✅ Semver, 90-day expiry, sector=grants')
          "

      - name: "W2.4 — Jurisdiction configuration"
        run: |
          python3 -c "
          import yaml, sys
          with open('data/policies/sectors/grant-eligibility-v1.yaml') as f:
              policy = yaml.safe_load(f)
          j = policy['jurisdiction']
          assert len(j['bitmask_schema']) >= 6
          for cc in ['KP','IR','SY','CU']: assert cc in j['sanctioned_country_codes']
          assert 'elevated_risk_country_codes' in j
          print('  ✅ Bitmasks, sanctions, elevated risk')
          "

      - name: "W2.5 — Risk thresholds ordered"
        run: |
          python3 -c "
          import yaml, sys
          with open('data/policies/sectors/grant-eligibility-v1.yaml') as f:
              policy = yaml.safe_load(f)
          t = policy['thresholds']
          for tier in ['allow','educate','inspect','block','hard_block']: assert tier in t
          assert t['allow']['max_risk'] <= t['educate']['max_risk'] <= t['inspect']['max_risk'] <= t['block']['max_risk'] <= t['hard_block']['min_risk']
          print('  ✅ Monotonically ordered thresholds')
          "

      - name: "W2.6 — Gilligan mercy configuration"
        run: |
          python3 -c "
          import yaml, sys
          with open('data/policies/sectors/grant-eligibility-v1.yaml') as f:
              policy = yaml.safe_load(f)
          g = policy['gilligan']['mercy']
          assert g['enabled'] is True
          assert g['max_intervention'] == 'EDUCATE'
          assert g['trust_threshold'] > 0
          assert g['critical_findings_override'] is False
          print('  ✅ Enabled, max=EDUCATE, trust>0, critical overrides')
          "

      - name: "W2.7 — Levinas SLA and contestability"
        run: |
          python3 -c "
          import yaml, sys
          with open('data/policies/sectors/grant-eligibility-v1.yaml') as f:
              policy = yaml.safe_load(f)
          l = policy['levinas']
          assert l['sla']['initial_response_hours'] <= 24
          assert l['sla']['appeal_response_hours'] <= 72
          assert 'BLOCK' in l['contestability']['contestable_actions']
          assert l['contestability']['hard_block_contestable'] is False
          assert set(l['language']['supported_groups']) == {'en-US','pt-BR','es','sw'}
          print('  ✅ SLA timers, contestability, 4 languages')
          "

      - name: "W2.8 — Jonas enforcement for uncalibrated groups"
        run: |
          python3 -c "
          import yaml, sys
          with open('data/policies/sectors/grant-eligibility-v1.yaml') as f:
              policy = yaml.safe_load(f)
          j = policy['jonas']
          assert j['policy_expiry_days'] == 90
          assert j['bias']['require_declaration'] is True
          uncal = j['bias']['uncalibrated_groups']
          assert len(uncal) > 0
          for g in uncal:
              assert g['group'] == 'sw' and g['action'] == 'FLAG'
              assert 'Jonas' in g.get('description','') or 'integrity' in g.get('description','').lower()
          print('  ✅ 90d expiry, bias required, sw=FLAG, Jonas referenced')
          "

      - name: "W2.9 — ADR-043 existence and completeness"
        run: |
          ADR="docs/adr/0057-grant-decision-adapter.md"
          if [ ! -f "$ADR" ]; then echo "  ❌ ADR-043 not found"; exit 1; fi
          python3 -c "
          with open('docs/adr/0057-grant-decision-adapter.md') as f:
              adr = f.read()
          for kw in ['use_decide=True','HMAC-SHA256','JSON minified','hard_blocked','GrantBlockedError','null','sectors/']:
              assert kw in adr, f'Missing: {kw}'
          for ref in ['ADR-001','ADR-015','ADR-022','ADR-031']: assert ref in adr
          assert 'Consequences Summary' in adr
          assert 'Validation Criteria' in adr
          words = len(adr.split())
          assert words > 2000, f'ADR too short: {words}'
          print(f'  ✅ 7 decisions, cross-refs, tables, {words} words')
          "

  # =========================================================================
  # WEEK 3 — Test Suite (800 Adversarial Cases)
  # =========================================================================
  week3-test-cases:
    name: "Week 3 — Test Cases (800)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event.inputs.week_filter == 'all' ||
      github.event.inputs.week_filter == '3' ||
      github.event.inputs.week_filter == ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "Install dependencies"
        run: python -m pip install --upgrade pip

      - name: "W3.1 — Test file existence"
        run: |
          if [ -f "tests/test_grants_adapter.py" ]; then
            echo "  ✅ test_grants_adapter.py ($(wc -l < tests/test_grants_adapter.py) lines)"
          else
            echo "  ❌ missing"; exit 1
          fi

      - name: "W3.2 — 800+ test cases total"
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, 'sdk/integrations/grants')
          sys.path.insert(0, 'tests')
          from test_grants_adapter import ALL_TEST_CASES
          total = len(ALL_TEST_CASES)
          if total < 800: print(f'  ❌ Need 800+, got {total}'); sys.exit(1)
          print(f'  ✅ {total} >= 800')
          "

      - name: "W3.3 — All 8 categories × 100+ cases"
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, 'sdk/integrations/grants')
          sys.path.insert(0, 'tests')
          from test_grants_adapter import (
              STRUCTURAL_VALIDATION_TESTS, SANITIZATION_TESTS, HARD_BLOCK_TESTS,
              POLICY_BLOCK_TESTS, MERCY_TESTS, LANGUAGE_TESTS, BIAS_TESTS, SESSION_TESTS, ALL_TEST_CASES
          )
          cats = {'structural': STRUCTURAL_VALIDATION_TESTS, 'sanitization': SANITIZATION_TESTS,
                  'hard_block': HARD_BLOCK_TESTS, 'policy_block': POLICY_BLOCK_TESTS,
                  'mercy': MERCY_TESTS, 'language': LANGUAGE_TESTS, 'bias': BIAS_TESTS, 'session': SESSION_TESTS}
          all_pass = True
          for n, c in sorted(cats.items()):
              ok = '✅' if len(c) >= 100 else '❌'
              print(f'  {ok} {n:20s} {len(c):4d}')
              if len(c) < 100: all_pass = False
          if not all_pass: sys.exit(1)
          total = sum(len(c) for c in cats.values())
          assert total == len(ALL_TEST_CASES)
          print(f'  ✅ All 8 categories >= 100, union matches ALL_TEST_CASES')
          "

      - name: "W3.4 — All 4 linguistic groups represented"
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, 'sdk/integrations/grants')
          sys.path.insert(0, 'tests')
          from test_grants_adapter import ALL_TEST_CASES
          from collections import Counter
          groups = Counter(tc.linguistic_group for tc in ALL_TEST_CASES)
          for g in ['en-US','pt-BR','es','sw']:
              count = groups.get(g, 0)
              if count == 0: print(f'  ❌ No cases for {g}'); sys.exit(1)
              print(f'  ✅ {g:8s} {count:4d}')
          print('  ✅ All 4 groups represented')
          "

      - name: "W3.5 — Ground truth coverage"
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, 'sdk/integrations/grants')
          sys.path.insert(0, 'tests')
          from test_grants_adapter import ALL_TEST_CASES
          from collections import Counter
          truths = Counter(tc.ground_truth for tc in ALL_TEST_CASES)
          for t, c in sorted(truths.items(), key=lambda x: -x[1]):
              print(f'    {t:25s} {c:4d}')
          for rt in ['ALLOW','BLOCK','HARD_BLOCK']:
              assert truths.get(rt,0) > 0, f'No {rt}!'
          print('  ✅ ALLOW, BLOCK, HARD_BLOCK covered')
          "

      - name: "W3.6 — TestCase data integrity"
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, 'sdk/integrations/grants')
          sys.path.insert(0, 'tests')
          from test_grants_adapter import ALL_TEST_CASES
          issues = 0
          for tc in ALL_TEST_CASES:
              if not tc.id or not tc.category or len(tc.description) < 10: issues += 1
              if not tc.ground_truth or not tc.linguistic_group: issues += 1
              if not tc.proposal_data or 'applicant_id' not in tc.proposal_data: issues += 1
          if issues: print(f'  ❌ {issues} integrity issues'); sys.exit(1)
          print(f'  ✅ All {len(ALL_TEST_CASES)} cases pass integrity')
          "

      - name: "W3.7 — ID format uniqueness"
        run: |
          python3 -c "
          import sys, re
          sys.path.insert(0, 'sdk/integrations/grants')
          sys.path.insert(0, 'tests')
          from test_grants_adapter import ALL_TEST_CASES
          ids = [tc.id for tc in ALL_TEST_CASES]
          assert len(ids) == len(set(ids)), 'Duplicate IDs!'
          assert all(re.match(r'^[A-Z]{2,4}-\d{3,4}$', i) for i in ids), 'Bad ID format!'
          print(f'  ✅ {len(set(ids))} unique IDs, format OK')
          "

      - name: "W3.8 — Hard block tests always should_raise=True"
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, 'sdk/integrations/grants')
          sys.path.insert(0, 'tests')
          from test_grants_adapter import HARD_BLOCK_TESTS
          issues = 0
          for tc in HARD_BLOCK_TESTS:
              if tc.ground_truth == 'HARD_BLOCK' and not tc.should_raise: issues += 1
              if tc.ground_truth == 'HARD_BLOCK' and tc.expected_exception != 'GrantBlockedError': issues += 1
          if issues: sys.exit(1)
          print(f'  ✅ All {len(HARD_BLOCK_TESTS)} hard_block tests consistent')
          "

  # =========================================================================
  # WEEK 4 — Runner + Schema + Integration
  # =========================================================================
  week4-runner:
    name: "Week 4 — Runner + Schema"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event.inputs.week_filter == 'all' ||
      github.event.inputs.week_filter == '4' ||
      github.event.inputs.week_filter == ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: "W4.1 — Runner file existence"
        run: |
          for f in "tests/run_tests.py" "tests/adversarial_data/dataset_schema.json"; do
            if [ -f "$f" ]; then echo "  ✅ $f"; else echo "  ❌ $f missing"; exit 1; fi
          done

      - name: "W4.2 — Runner CLI help"
        run: cd tests && python3 run_tests.py --help && echo "  ✅ --help works"

      - name: "W4.3 — Runner dry-run mode"
        run: |
          cd tests
          python3 run_tests.py --dry-run 2>&1 | head -50
          echo "  ✅ Dry run exits 0"

      - name: "W4.4 — Runner category filter"
        run: |
          cd tests
          for cat in structural sanitization hard_block policy_block mercy language bias session; do
            OUTPUT=$(python3 run_tests.py --cat "$cat" --dry-run 2>&1)
            if echo "$OUTPUT" | grep -q "$cat"; then
              echo "  ✅ --cat $cat"
            else
              echo "  ❌ --cat $cat failed"; exit 1
            fi
          done

      - name: "W4.5 — Runner linguistic group filter"
        run: |
          cd tests
          for lang in en-US pt-BR es sw; do
            OUTPUT=$(python3 run_tests.py --lang "$lang" --dry-run 2>&1)
            if echo "$OUTPUT" | grep -q "$lang"; then
              echo "  ✅ --lang $lang"
            else
              echo "  ❌ --lang $lang failed"; exit 1
            fi
          done

      - name: "W4.6 — JSON output"
        run: |
          cd tests
          python3 run_tests.py --dry-run --json --output /tmp/btv_test_results.json 2>&1
          python3 -c "
          import json
          with open('/tmp/btv_test_results.json') as f: d = json.load(f)
          for k in ['total','passed','failed','skipped','categories','linguistic_groups']:
              assert k in d, f'Missing: {k}'
          print(f'  ✅ JSON valid: total={d[\"total\"]}')
          "

      - name: "W4.7 — Dataset schema validation"
        run: |
          python3 -c "
          import json, jsonschema
          with open('tests/adversarial_data/dataset_schema.json') as f: s = json.load(f)
          assert s['\$schema'] == 'http://json-schema.org/draft-07/schema#'
          for f2 in ['version','generated_at','total_cases','categories','linguistic_groups','cases']:
              assert f2 in s['required'], f'Missing required: {f2}'
          assert s['properties']['cases']['minItems'] >= 800
          lg = s['properties']['linguistic_groups']['items']['enum']
          assert set(lg) == {'en-US','pt-BR','es','sw'}
          sw = s['properties']['bias_declarations']['properties']['sw']['properties']
          assert sw['fpr']['type'] == 'null' and sw['fnr']['type'] == 'null'
          print('  ✅ Draft-07, required fields, minItems>=800, sw=null')
          "

      - name: "W4.8 — Unit tests"
        run: |
          cd tests
          PYTHONPATH=../sdk/integrations/grants python3 -m unittest test_grants_adapter -v 2>&1 | tail -20
          echo "  ✅ Unit tests executed"

  # =========================================================================
  # GATE — All weeks must pass
  # =========================================================================
  full-pipeline:
    name: "Full Pipeline Gate"
    runs-on: ubuntu-latest
    needs: [week1-core, week2-policy-adr, week3-test-cases, week4-runner]
    if: always()

    steps:
      - name: "Check all weeks passed"
        run: |
          echo "Week 1: ${{ needs.week1-core.result }}"
          echo "Week 2: ${{ needs.week2-policy-adr.result }}"
          echo "Week 3: ${{ needs.week3-test-cases.result }}"
          echo "Week 4: ${{ needs.week4-runner.result }}"
          if [[ "${{ needs.week1-core.result }}" == "success" &&
                "${{ needs.week2-policy-adr.result }}" == "success" &&
                "${{ needs.week3-test-cases.result }}" == "success" &&
                "${{ needs.week4-runner.result }}" == "success" ]]; then
            echo "✅ ALL WEEKS PASS — Grant Adapter CI COMPLETE"
          else
            echo "❌ PIPELINE FAILED — one or more weeks failed"
            exit 1
          fi
