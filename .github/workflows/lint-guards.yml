name: Lint Guards

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:
    branches: [main, develop]

jobs:
  guards:
    name: Static security & architecture guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run lint guards
        run: bash scripts/ci/lint_guards.sh

      - name: Confirm sqlite_connect_wal coverage
        run: |
          set -e
          # If the helper itself is missing, fail loudly. Migrations rely on it.
          test -f python/buildtovalue/security/db.py
          grep -q 'def sqlite_connect_wal' python/buildtovalue/security/db.py

      - name: Confirm HMAC key indirection
        run: |
          set -e
          test -f python/buildtovalue/security/keys.py
          test -f rust/kernel/src/keys.rs
          grep -q 'def get_hmac_key' python/buildtovalue/security/keys.py
          grep -q 'fn kernel_mac_key' rust/kernel/src/keys.rs

      - name: Confirm RELEASE_GATES present
        run: test -f docs/RELEASE_GATES.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "C-* control liveness ratchet (#185)"
        run: |
          set -e
          # httpx: governance/__init__.py eagerly imports policy_tester (httpx).
          # Mirrors the dep set in fail_secure_ci.yml. No compiled kernel needed.
          pip install --quiet pytest pyyaml httpx
          # Governance liveness guards + ratchet. Fails if any governance control
          # has no proof of activation and is not allowlisted (dead control at PR).
          cd python
          python -m pytest -q \
            tests/governance/test_control_activation.py \
            tests/governance/test_control_activation_ratchet.py

      - name: Validate VPS compose syntax
        run: docker compose -f ops/docker-compose.vps.yml config --quiet && echo "VPS compose OK"

      - name: Validate VPS nginx config syntax
        run: |
          # `nginx -t` carrega os `ssl_certificate` referenciados — sem eles
          # falha em "cannot load certificate" antes de checar a sintaxe. Os
          # certs reais são provisionados pelo certbot em runtime (Let's
          # Encrypt), inexistentes no runner. Geramos certs self-signed
          # descartáveis nos caminhos esperados só para validar a SINTAXE.
          docker run --rm \
            -v "$(pwd)/ops/nginx/nginx.vps.conf:/etc/nginx/nginx.conf:ro" \
            nginx:alpine sh -ec '
              apk add --no-cache openssl >/dev/null
              for d in docs.buildtovalue.cloud demo.buildtovalue.cloud; do
                mkdir -p "/etc/letsencrypt/live/$d"
                openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
                  -keyout "/etc/letsencrypt/live/$d/privkey.pem" \
                  -out    "/etc/letsencrypt/live/$d/fullchain.pem" \
                  -subj "/CN=$d" >/dev/null 2>&1
              done
              nginx -t
            ' && echo "nginx.vps.conf OK"
