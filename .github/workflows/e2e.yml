# =============================================================================
# BTV E2E CI — Proxy HTTP Transparente
# =============================================================================
# Porta de CI para o fluxo crítico: Agente → Gateway (Rust/Axum) → Governance
# (Python) → Ledger. Executa em todo pull_request para main.
#
# Jobs:
#   e2e-proxy  — sobe docker-compose quickstart, aguarda health checks,
#                executa tests/e2e/test_proxy_flow.py
#
# Triggers:
#   pull_request para main (paths: gateway, governance, E2E, compose, Dockerfiles)
#   push para main
#   manual dispatch
# =============================================================================

name: E2E — Proxy HTTP Transparente

on:
  push:
    branches: [main]
    paths:
      - "rust/gateway/**"
      - "python/buildtovalue/**"
      - "tests/e2e/**"
      - "ops/docker-compose.quickstart.yml"
      - "ops/docker-compose.e2e.yml"
      - "ops/Dockerfile.rust"
      - "ops/Dockerfile.rust-ci"
      - "ops/Dockerfile.python"
      - "ops/Dockerfile.python-quickstart"
      - "data/policies/quickstart/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "rust/gateway/**"
      - "python/buildtovalue/**"
      - "tests/e2e/**"
      - "ops/docker-compose.quickstart.yml"
      - "ops/docker-compose.e2e.yml"
      - "ops/Dockerfile.rust"
      - "ops/Dockerfile.rust-ci"
      - "ops/Dockerfile.python"
      - "ops/Dockerfile.python-quickstart"
      - "data/policies/quickstart/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:
    inputs:
      bundle:
        description: "Policy bundle a ativar"
        required: false
        default: "baseline_trust"
        type: choice
        options: ["baseline_trust", "gdpr_art22_chatbot", "hipaa_phi_audit"]

env:
  PYTHON_VERSION: "3.11"
  BTV_POLICY_BUNDLE: ${{ github.event.inputs.bundle || 'baseline_trust' }}

jobs:
  e2e-proxy:
    name: "E2E — Agente → Gateway → Governance"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # ── Rust toolchain + cache (compila o gateway no runner, não no Docker) ──
      - name: "Install Rust toolchain"
        uses: dtolnay/rust-toolchain@stable

      - name: "Cache Rust build artifacts"
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: "Build gateway binary (usa cache do runner)"
        working-directory: ./rust
        env:
          BTV_HMAC_KEY: "ci-workspace-test-key-padded-for-hmac"
        run: cargo build --release -p btv-gateway

      - name: "Exportar binário para contexto Docker"
        run: |
          mkdir -p bin
          cp rust/target/release/btv-gateway bin/btv-gateway

      # ── Python (para pytest) ───────────────────────────────────────────────
      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "Install pytest"
        run: pip install pytest

      # ── Docker Compose — governance + gateway (pré-compilado) + upstream ──
      # Usa Dockerfile.rust-ci: copia o binário pré-compilado em vez de
      # recompilar o Rust dentro do Docker (~10 min → ~10 s).
      - name: "Verificar pré-requisitos Docker"
        run: |
          echo "=== docker compose version ==="
          docker compose version
          echo "=== binário gateway ==="
          ls -la bin/btv-gateway
          echo "=== compose config resolving ==="
          docker compose -f ops/docker-compose.e2e.yml config --quiet && echo "config OK"
        env:
          BTV_POLICY_BUNDLE: ${{ env.BTV_POLICY_BUNDLE }}

      - name: "Build images (docker compose)"
        run: |
          docker compose -f ops/docker-compose.e2e.yml build --progress=plain
        env:
          BTV_POLICY_BUNDLE: ${{ env.BTV_POLICY_BUNDLE }}

      - name: "Subir serviços"
        run: |
          docker compose -f ops/docker-compose.e2e.yml up -d || {
            echo "::group::governance logs (startup failure)"
            docker compose -f ops/docker-compose.e2e.yml logs governance --tail=100
            echo "::endgroup::"
            exit 1
          }
        env:
          BTV_POLICY_BUNDLE: ${{ env.BTV_POLICY_BUNDLE }}

      # ── Diagnóstico imediato pós-start ────────────────────────────────────────
      - name: "Status containers (t+5s)"
        run: |
          sleep 5
          echo "=== container status ==="
          docker compose -f ops/docker-compose.e2e.yml ps
          echo "=== governance logs (primeiros 5s) ==="
          docker compose -f ops/docker-compose.e2e.yml logs governance --tail=80
        env:
          BTV_POLICY_BUNDLE: ${{ env.BTV_POLICY_BUNDLE }}

      # ── Aguardar health checks ─────────────────────────────────────────────
      - name: "Aguardar governance /health"
        run: |
          echo "Aguardando governance..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "  ✅ Governance respondeu em ${i}×5s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "  ❌ Governance não respondeu após 150s"
              echo "::group::governance logs"
              docker compose -f ops/docker-compose.e2e.yml logs governance --tail=100
              echo "::endgroup::"
              exit 1
            fi
            sleep 5
          done

      - name: "Aguardar gateway /health"
        run: |
          echo "Aguardando gateway..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "  ✅ Gateway respondeu em ${i}×5s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "  ❌ Gateway não respondeu após 150s"
              docker compose -f ops/docker-compose.e2e.yml logs gateway
              exit 1
            fi
            sleep 5
          done

      - name: "Aguardar upstream-mock"
        run: |
          echo "Aguardando upstream-mock..."
          for i in $(seq 1 12); do
            if curl -sf http://localhost:8082/status/200 > /dev/null 2>&1; then
              echo "  ✅ upstream-mock ok"
              break
            fi
            sleep 5
          done

      # ── E2E tests ─────────────────────────────────────────────────────────
      - name: "Executar testes E2E"
        run: |
          pytest tests/e2e/test_proxy_flow.py -v --tb=short
        env:
          BTV_GATEWAY_URL: "http://localhost:8080"
          BTV_UPSTREAM_MOCK: "http://localhost:8082"

      # ── Diagnóstico em caso de falha ───────────────────────────────────────
      - name: "Logs dos serviços (somente em falha)"
        if: failure()
        run: |
          echo "::group::gateway logs"
          docker compose -f ops/docker-compose.e2e.yml logs gateway --tail=50
          echo "::endgroup::"
          echo "::group::governance logs"
          docker compose -f ops/docker-compose.e2e.yml logs governance --tail=50
          echo "::endgroup::"

      - name: "Parar serviços"
        if: always()
        run: docker compose -f ops/docker-compose.e2e.yml down -v
