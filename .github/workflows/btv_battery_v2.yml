name: BTV Battery v2 — Security Coverage

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "rust/kernel/src/validators/attack/**"
      - "rust/kernel/src/core/types.rs"
      - "rust/kernel/src/gatekeeper.rs"
      - "python/buildtovalue/api/app.py"
      - "tests/ci/test_btv_battery_v2.py"
      - ".github/workflows/btv_battery_v2.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  battery-v2:
    name: BTV Battery v2 (60 security cases)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      BTV_HMAC_KEY: "ci-test-hmac-key-exactly-32-bytes!"
      BTV_JWT_SECRET: "ci-test-jwt-secret-36-chars-long-ok!"
      BTV_ENV: development
      BTV_API_KEY: "2e9854d03357579fa1a48b7cbdfc3296"
      BTV_DB_PATH: "/tmp/btv_ci_trust.db"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: battery-v2-${{ runner.os }}-${{ hashFiles('rust/**/Cargo.lock') }}
          restore-keys: |
            battery-v2-${{ runner.os }}-
            bindings-${{ runner.os }}-

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install maturin pytest httpx

      - name: Install Python package + dependencies
        run: pip install -e python/

      - name: Build Rust kernel wheel
        working-directory: rust
        run: maturin build --release -m bindings/Cargo.toml

      - name: Install Rust kernel wheel
        working-directory: rust
        run: pip install target/wheels/*.whl

      - name: Verify kernel import
        run: python -c "import buildtovalue_kernel as k; print('kernel OK, version:', k.__version__)"

      - name: Start governance server
        run: |
          (cd python && uvicorn buildtovalue.api.app:app \
            --host 0.0.0.0 --port 8000 --log-level warning) &
          echo "Waiting for governance server..."
          timeout 60 bash -c 'until curl -sf http://localhost:8000/health; do sleep 1; done'
          echo "Server is up."

      - name: Run BTV Battery v2
        env:
          BTV_BASE_URL: "http://localhost:8000"
        run: |
          cd python && pytest ../tests/ci/test_btv_battery_v2.py \
            -v --tb=short -m e2e \
            --junit-xml=../battery_v2_results.xml

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battery-v2-junit
          path: battery_v2_results.xml
