
name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Job 1: Run Tests
  # ═══════════════════════════════════════════════════════════════
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.75.0
          profile: minimal
          override: true
          components: rustfmt, clippy
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
      
      - name: Install Rust dependencies
        run: cargo build --release
      
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Run Rust tests
        run: cargo test --all-features
      
      - name: Run Rust clippy
        run: cargo clippy -- -D warnings
      
      - name: Run Python tests
        run: |
          pytest tests/unit/ -v --cov=governance --cov-report=xml
      
      - name: Run integration tests
        run: |
          pytest tests/integration/ -v
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
  
  # ═══════════════════════════════════════════════════════════════
  # Job 2: Ethical Tests (Blind Policy + Bias Detection)
  # ═══════════════════════════════════════════════════════════════
  ethical-tests:
    name: Ethical Tests
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      
      - name: Run blind policy tests
        run: pytest tests/ethical/test_blind_policy.py -v -m ethical
      
      - name: Run bias detection tests
        run: pytest tests/ethical/test_bias_detection.py -v -m bias
      
      - name: Run ethical committee review
        run: pytest tests/ethical/test_ethical_committee.py -v -m committee
      
      - name: Generate ethical report
        if: always()
        run: |
          python scripts/generate_ethical_report.py > ethical-report.md
      
      - name: Upload ethical report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: ethical-report
          path: ethical-report.md
  
  # ═══════════════════════════════════════════════════════════════
  # Job 3: Security Scan
  # ═══════════════════════════════════════════════════════════════
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Run cargo audit (Rust dependencies)
        run: |
          cargo install cargo-audit
          cargo audit
      
      - name: Run safety (Python dependencies)
        run: |
          pip install safety
          safety check --json
  
  # ═══════════════════════════════════════════════════════════════
  # Job 4: Build Docker Images
  # ═══════════════════════════════════════════════════════════════
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test, ethical-tests, security-scan]
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
  
  # ═══════════════════════════════════════════════════════════════
  # Job 5: Deploy to Staging (Auto)
  # ═══════════════════════════════════════════════════════════════
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    
    environment:
      name: staging
      url: https://staging-api.buildtovalue.com
    
    steps:
      - name: Checkout infrastructure repo
        uses: actions/checkout@v4
        with:
          repository: buildtovalue/infrastructure
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          ref: main
      
      - name: Update image tag (staging)
        run: |
          cd k8s/overlays/staging
          kustomize edit set image \
            buildtovalue-api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      
      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add k8s/overlays/staging/kustomization.yaml
          git commit -m "chore: update staging image to ${{ github.sha }}"
          git push
      
      - name: Wait for ArgoCD sync
        run: |
          echo "Waiting for ArgoCD to sync staging deployment..."
          sleep 60
      
      - name: Run smoke tests
        run: |
          curl --fail https://staging-api.buildtovalue.com/v2/health || exit 1
  
  # ═══════════════════════════════════════════════════════════════
  # Job 6: Deploy to Production (Manual Approval)
  # ═══════════════════════════════════════════════════════════════
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    
    environment:
      name: production
      url: https://api.buildtovalue.com
    
    steps:
      - name: Checkout infrastructure repo
        uses: actions/checkout@v4
        with:
          repository: buildtovalue/infrastructure
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          ref: main
      
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Update image tag (production)
        run: |
          cd k8s/overlays/production
          kustomize edit set image \
            buildtovalue-api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
      
      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add k8s/overlays/production/kustomization.yaml
          git commit -m "chore: update production image to ${{ steps.version.outputs.VERSION }}"
          git push
      
      - name: Wait for ArgoCD sync
        run: |
          echo "Waiting for ArgoCD to sync production deployment..."
          sleep 120
      
      - name: Run smoke tests
        run: |
          curl --fail https://api.buildtovalue.com/v2/health || exit 1
      
      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          channel-id: 'deployments'
          slack-message: |
            🚀 Production Deployment Complete
            Version: ${{ steps.version.outputs.VERSION }}
            Status: ${{ job.status }}
            Commit: ${{ github.sha }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  
  # ═══════════════════════════════════════════════════════════════
  # Job 7: E2E Tests (Post-Deployment)
  # ═══════════════════════════════════════════════════════════════
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      
      - name: Run E2E tests (staging)
        env:
          API_BASE_URL: https://staging-api.buildtovalue.com/v2
          API_KEY: ${{ secrets.STAGING_API_KEY }}
        run: |
          pytest tests/e2e/ -v --tb=short
      
      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: e2e-report
          path: e2e-report.html