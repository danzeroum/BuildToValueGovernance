# BuildToValue — Nginx TLS Reverse Proxy (dev)
events {
    worker_connections 1024;
}

http {
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    # Gateway (Rust :8080) → HTTPS :8443
    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/btv-dev.crt;
        ssl_certificate_key /etc/nginx/certs/btv-dev.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://gateway:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Governance (Python :8000) → HTTPS :9443
    server {
        listen 9443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/btv-dev.crt;
        ssl_certificate_key /etc/nginx/certs/btv-dev.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://governance:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Redirect HTTP → HTTPS
    server {
        listen 8080;
        return 301 https://$host:8443$request_uri;
    }
}
