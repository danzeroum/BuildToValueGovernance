worker_processes auto;
events { worker_connections 1024; }

http {
    resolver 127.0.0.11 valid=30s;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Security Headers
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    # SSL Configurações globais
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # --- Gateway: Documentação ---
    server {
        listen 80;
        listen [::]:80;
        server_name docs.buildtovalue.cloud;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name docs.buildtovalue.cloud;

        ssl_certificate     /etc/letsencrypt/live/demo.buildtovalue.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/demo.buildtovalue.cloud/privkey.pem;

        root /var/www/buildtovalue/docs;
        index index.html;
        location / { try_files $uri $uri/ =404; }
    }

    # --- Gateway: Demonstração ---
    server {
        listen 80;
        listen [::]:80;
        server_name demo.buildtovalue.cloud;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name demo.buildtovalue.cloud;

        ssl_certificate     /etc/letsencrypt/live/demo.buildtovalue.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/demo.buildtovalue.cloud/privkey.pem;

        root /var/www/buildtovalue/demo;
        index index.html;
        location / { try_files $uri $uri/ =404; }
    }


    # --- Gateway: ChatCorp ---
    server {
        listen 80;
        listen [::]:80;
        server_name chatcorp.buildtovalue.cloud;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name chatcorp.buildtovalue.cloud;

        ssl_certificate     /etc/letsencrypt/live/chatcorp.buildtovalue.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/chatcorp.buildtovalue.cloud/privkey.pem;

        location / {
            set $upstream_chatcorp btvchatcorp-nginx-1;
            proxy_pass http://$upstream_chatcorp:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            client_max_body_size 50M;
        }
    }


    # --- Gateway: Prompt Engineering Pro ---
    server {
        listen 80;
        listen [::]:80;
        server_name prompte.buildtovalue.cloud;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name prompte.buildtovalue.cloud;

        ssl_certificate     /etc/letsencrypt/live/prompte.buildtovalue.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/prompte.buildtovalue.cloud/privkey.pem;

        location / {
            set $upstream_prompte prompte-frontend;
            proxy_pass http://$upstream_prompte:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }


}
