worker_processes auto;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # Catch-all — fecha conexão sem resposta
    server {
        listen 80  default_server;
        listen 443 ssl default_server;
        ssl_reject_handshake on;
        server_name _;
        return 444;
    }

    # Healthcheck interno Docker
    server {
        listen 8080;
        server_name localhost;
        location /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    # HTTP → HTTPS para todos os domínios
    server {
        listen 80;
        server_name docs.buildtovalue.cloud demo.buildtovalue.cloud
                    chatcorp.buildtovalue.cloud prompte.buildtovalue.cloud;
        location /.well-known/acme-challenge/ { root /var/www/html; }
        location / { return 301 https://$host$request_uri; }
    }

    # docs.buildtovalue.cloud
    server {
        listen 443 ssl;
        server_name docs.buildtovalue.cloud;
        ssl_certificate     /etc/letsencrypt/live/docs.buildtovalue.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/docs.buildtovalue.cloud/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        root  /var/www/buildtovalue/docs;
        index index.html;
        location / { try_files $uri $uri/ =404; }
        location ~* \.(css|js|png|jpg|jpeg|svg|woff2|ico|webp)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # demo.buildtovalue.cloud
    server {
        listen 443 ssl;
        server_name demo.buildtovalue.cloud;
        ssl_certificate     /etc/letsencrypt/live/demo.buildtovalue.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/demo.buildtovalue.cloud/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        root  /var/www/buildtovalue/demo;
        index index.html;
        location / { try_files $uri $uri/ =404; }
        location ~* \.(css|js|png|jpg|jpeg|svg|woff2|ico|webp)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # chatcorp.buildtovalue.cloud → container btvchatcorp-nginx-1
    server {
        listen 443 ssl;
        server_name chatcorp.buildtovalue.cloud;
        ssl_certificate     /etc/letsencrypt/live/chatcorp.buildtovalue.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/chatcorp.buildtovalue.cloud/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        location / {
            proxy_pass http://btvchatcorp-nginx-1:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            client_max_body_size 50M;
        }
    }

    # prompte.buildtovalue.cloud → container prompte-frontend
    server {
        listen 443 ssl;
        server_name prompte.buildtovalue.cloud;
        ssl_certificate     /etc/letsencrypt/live/prompte.buildtovalue.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/prompte.buildtovalue.cloud/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        location / {
            proxy_pass http://prompte-frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
