# ops/nginx/nginx.vps.conf
# BuildToValue — Nginx VPS Production (arquivos estáticos + TLS)
# Serve conteúdo compilado de /var/www/buildtovalue/ via HTTPS.
#
# NÃO É o nginx.conf de CI/dev (ops/nginx/nginx.conf).
# Este arquivo é montado exclusivamente pelo btv-nginx-prod no
# docker-compose.vps.yml. O nginx.conf de CI continua intocado.
#
# Domínios servidos:
#   https://docs.buildtovalue.cloud → /var/www/buildtovalue/docs (MkDocs)
#   https://demo.buildtovalue.cloud → /var/www/buildtovalue/demo (frontend)
#
# Renovação automática Let's Encrypt:
#   O certbot usa --webroot e escreve em /var/www/html no host.
#   O volume /var/www/html:ro permite que o Nginx sirva o ACME challenge
#   sem interromper o serviço (zero-downtime renewal).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Cabeçalhos de segurança (aplicados globalmente) ───────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile on;
    gzip     on;
    gzip_types text/plain text/css application/javascript application/json;

    # ── Catch-all: derruba requisições diretas ao IP ou hosts não reconhecidos ─
    # Zero Trust: scanners e bots que acessem pelo IP recebem RST (sem resposta).
    #
    # HTTP → return 444 fecha a conexão TCP sem enviar resposta HTTP.
    # TLS  → ssl_reject_handshake on encerra no nível TLS *antes* do handshake
    #         (Nginx ≥ 1.19.4, incluído no nginx:alpine atual). Nenhum certificado
    #         é necessário e nenhum nome de domínio é vazado a scanners.
    server {
        listen 80  default_server;
        listen 443 ssl default_server;
        ssl_reject_handshake on;   # fecha no handshake TLS — zero information leak
        server_name _;
        return 444;
    }

    # ── Healthcheck — porta interna dedicada (sem ambiguidade de server_name) ─
    # O Docker bate em localhost:8080/healthz de dentro do próprio contêiner.
    # Esta porta NÃO é exposta no compose (sem ports: 8080:8080).
    server {
        listen 8080;
        server_name localhost;
        location /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    # ── Redirect HTTP → HTTPS + ACME challenge passthrough ───────────────────
    server {
        listen 80;
        server_name docs.buildtovalue.cloud demo.buildtovalue.cloud;

        # Let's Encrypt ACME webroot challenge (renovação zero-downtime)
        # certbot escreve em /var/www/html no host; volume :ro dentro do container.
        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        # Tudo o mais → HTTPS (301 permanente)
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── docs.buildtovalue.cloud ───────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name docs.buildtovalue.cloud;

        ssl_certificate     /etc/letsencrypt/live/docs.buildtovalue.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/docs.buildtovalue.cloud/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Serve conteúdo estático compilado pelo MkDocs
        # Sem proxy_pass: Nginx lê diretamente do volume :ro (sem latência extra)
        root  /var/www/buildtovalue/docs;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # Cache de assets estáticos imutáveis (CSS, JS, imagens, fontes)
        location ~* \.(css|js|png|jpg|jpeg|svg|woff2|ico|webp)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── demo.buildtovalue.cloud ───────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name demo.buildtovalue.cloud;

        ssl_certificate     /etc/letsencrypt/live/demo.buildtovalue.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/demo.buildtovalue.cloud/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Serve conteúdo estático do demo
        root  /var/www/buildtovalue/demo;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # Proxy para API Python local (deploy.sh em /opt/btv) — descomente se necessário:
        # location /api/ {
        #     proxy_pass http://host.docker.internal:8000/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        # }
    }
}
