# ops/docker-compose.vps.yml — BuildToValue VPS Ingress Controller
# ADR-009 v2: btv-nginx-prod como único ingress Docker para todos os domínios

services:
  nginx-prod:
    image: nginx:alpine
    container_name: btv-nginx-prod
    restart: unless-stopped
    networks:
      - btvchatcorp_btv-net
      - ops_btv-prod-net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/buildtovalue:/var/www/buildtovalue:ro
      - /var/www/html:/var/www/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  btvchatcorp_btv-net:
    external: true
  ops_btv-prod-net:
    external: true
