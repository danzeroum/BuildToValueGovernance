# ops/docker-compose.vps.yml
# ═══════════════════════════════════════════════════════════════
# BuildToValue Sovereign Trust OS — Orquestração VPS
# República Algorítmica: Nginx como único Ingress Controller
# ═══════════════════════════════════════════════════════════════
#
# ARQUITETURA (ADR-009 v2):
#   PROD → nginx-prod (Docker) serve arquivos estáticos de /var/www/
#   DEV  → scripts/deploy.sh gerencia processos nativos em /opt/btv/
#
# Separação de responsabilidades:
#   Docker    = Produção estável, declarativa, auditável
#   deploy.sh = Desenvolvimento ágil, hot-reload nativo
#
# Setup inicial (executar uma vez na VPS):
#   sudo mkdir -p /var/www/buildtovalue/{docs,demo} /var/www/html
#   sudo systemctl stop nginx && sudo systemctl disable nginx
#   cd /opt/buildtovalue
#   python3 scripts/autogen_reference.py
#   mkdocs build --site-dir /var/www/buildtovalue/docs --clean
#   rsync -av --delete demo/ /var/www/buildtovalue/demo/
#   sudo chown -R www-data:www-data /var/www/buildtovalue
#   docker compose -f ops/docker-compose.vps.yml up -d
#
# Teardown seguro (antes do primeiro deploy com este compose):
#   docker compose -f ops/docker-compose.vps.yml down --remove-orphans
#   lsof -i:9090 -i:9091  # deve retornar vazio
#
# Deploy de atualização de conteúdo (sem restart de contêiner):
#   git pull origin main
#   mkdocs build --site-dir /var/www/buildtovalue/docs --clean
#   rsync -av --delete demo/ /var/www/buildtovalue/demo/
#   # Nginx lê os arquivos novos automaticamente (volume :ro)
#
# Ver logs:
#   docker compose -f ops/docker-compose.vps.yml logs -f nginx-prod
# ═══════════════════════════════════════════════════════════════

services:
  nginx-prod:
    image: nginx:alpine
    container_name: btv-nginx-prod
    # PRÉ-REQUISITO: sudo systemctl stop nginx && sudo systemctl disable nginx
    # O Nginx do host e este container disputam as portas 80 e 443.
    restart: unless-stopped
    # unless-stopped: respeita paradas manuais (docker compose down),
    # mas reinicia automaticamente após reboot da VPS. Semântica correta
    # para produção que você quer poder parar voluntariamente.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.vps.conf:/etc/nginx/nginx.conf:ro      # config VPS (auto-contida)
      - /etc/letsencrypt:/etc/letsencrypt:ro                 # certificados Let's Encrypt
      - /var/www/buildtovalue:/var/www/buildtovalue:ro       # conteúdo estático compilado
      - /var/www/html:/var/www/html:ro                       # ACME challenge webroot (certbot)
    healthcheck:
      # Porta 8080 interna (dedicada) — evita ambiguidade com bloco :80 de redirect
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  default:
    driver: bridge
