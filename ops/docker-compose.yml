# ops/docker-compose.yml
# ═══════════════════════════════════════════════════════════════
# BuildToValue Sovereign Trust OS
# ═══════════════════════════════════════════════════════════════
# Usage:
#   docker compose up --build                          # core only (gateway + governance)
#   docker compose --profile observability up --build  # + Prometheus + Grafana
#   docker compose --profile dashboard up --build      # + internal Streamlit dashboard
#   docker compose --profile playground up --build     # + developer playground (port 8502)
#   docker compose --profile full up --build           # everything
# ═══════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────
  # CORE (always start)
  # ─────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ..
      dockerfile: ops/Dockerfile.rust
    ports:
      - "8080:8080"
    volumes:
      - ledger_data:/app/data/ledger
    depends_on:
      governance:
        condition: service_healthy
    environment:
      - RUST_LOG=info
      - BTV_GOVERNANCE_URL=http://governance:8000
    restart: unless-stopped

  governance:
    build:
      context: ..
      dockerfile: ops/Dockerfile.python
    ports:
      - "8000:8000"
    volumes:
      - ./runtime:/app/data/runtime
      - ../data/policies:/app/data/policies:ro
      - ./autogen-policies:/app/data/autogen-policies
      - ./models:/app/models
      - ledger_data:/app/data/ledger
    environment:
      # Required: must be set in the deploying shell or via .env (see ops/.env.example).
      # No fallback — production compose refuses to start without a real key.
      - BTV_HMAC_KEY=${BTV_HMAC_KEY:?BTV_HMAC_KEY must be set; generate with: openssl rand -hex 32}
      - BTV_ENV=${BTV_ENV:-development}
      - BTV_POLICY_DIR=/app/data/policies
      - BTV_DB_PATH=/app/data/runtime/trust.db
      - BTV_APPEALS_DB=/app/data/runtime/appeals.db
      - BTV_THREATS_DB=/app/data/runtime/threats.db
      - BTV_AUTOGEN_DIR=/app/data/autogen-policies
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: "4"
        # GPU reserved for inference workloads — optional.
        # Enable with: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
    healthcheck:
      test: [ "CMD", "python3.11", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  nginx:
      image: nginx:1.25-alpine
      ports:
        - "8443:8443"   # Gateway TLS
        - "9443:9443"   # Governance TLS
      volumes:
        - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        - ./nginx/btv-dev.crt:/etc/nginx/certs/btv-dev.crt:ro
        - ./nginx/btv-dev.key:/etc/nginx/certs/btv-dev.key:ro
      depends_on:
        governance:
          condition: service_healthy
      restart: unless-stopped
  # ─────────────────────────────────────────────────────────────
  # OBSERVABILITY (--profile observability | full)
  # ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    profiles: ["observability", "full"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - gateway
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    profiles: ["observability", "full"]
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-changeme}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # PLAYGROUND (--profile playground | full)
  # Developer-facing interactive demo at http://localhost:8502
  # ─────────────────────────────────────────────────────────────
  playground:
    build:
      context: ..
      dockerfile: ops/Dockerfile.playground
    profiles: ["playground", "full"]
    ports:
      - "8502:8502"
    environment:
      - BTV_GATEWAY_URL=http://gateway:8080
      - BTV_API_KEY=${BTV_API_KEY:-dev-key}
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # DASHBOARD (React SPA — served by gateway via static files)
  # The React dashboard is built into the gateway container.
  # Access at http://localhost:8080/ (no separate port needed).
  # Legacy Streamlit dashboard preserved for migration period.
  # ─────────────────────────────────────────────────────────────
  dashboard-legacy:
    build:
      context: ..
      dockerfile: ops/Dockerfile.streamlit
    profiles: ["dashboard-legacy"]
    ports:
      - "8501:8501"
    environment:
      - BTV_GATEWAY_URL=http://gateway:8080
      - BTV_GOVERNANCE_URL=http://governance:8000
    depends_on:
      - gateway
      - governance
    restart: unless-stopped

volumes:
  ledger_data:
  grafana_data: