services:
  gateway:
    build:
      context: ..
      dockerfile: ops/Dockerfile.rust
    ports:
      - "8080:8080"
    volumes:
      - ledger_data:/app/data/ledger
    depends_on:
      governance:
        condition: service_healthy
    environment:
      - RUST_LOG=info
      - BTV_GOVERNANCE_URL=http://governance:8000

  governance:
    build:
      context: ..
      dockerfile: ops/Dockerfile.python
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  ledger_data: