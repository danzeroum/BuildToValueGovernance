services:
  gateway:
    build:
      context: ..
      dockerfile: ops/Dockerfile.rust
    ports:
      - "8080:8080"
    volumes:
      - ledger_data:/app/data/ledger
    depends_on:
      governance:
        condition: service_healthy
    environment:
      - RUST_LOG=info
      - BTV_GOVERNANCE_URL=http://governance:8000

  governance:
    build:
      context: ..
      dockerfile: ops/Dockerfile.python
    ports:
      - "8000:8000"
    volumes:
      - trust_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=btv2026
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  dashboard:
    build:
      context: ..
      dockerfile: ops/Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      - BTV_GATEWAY_URL=http://gateway:8080
      - BTV_GOVERNANCE_URL=http://governance:8000
    depends_on:
      - gateway
      - governance

volumes:
  ledger_data:
  grafana_data:
  trust_data: