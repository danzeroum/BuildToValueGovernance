# ════════════════════════════════════════════════════════════════════════════
# BuildToValue v2.0 - ArgoCD Application
# ════════════════════════════════════════════════════════════════════════════
# ✅ CORRIGIDO: Namespace unificado + Repo URL correto
# ════════════════════════════════════════════════════════════════════════════

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: buildtovalue-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: buildtovalue
  
  # ═══════════════════════════════════════════════════════════════════════
  # Source (Git Repository)
  # ═══════════════════════════════════════════════════════════════════════
  source:
    # ✅ CORRIGIDO: Seu repositório real
    repoURL: https://github.com/danzeroum/BuildToValueGovernance
    targetRevision: main
    
    # ✅ CORRIGIDO: Path para k8s/base (não overlays/production)
    path: k8s/base
    
    # Kustomize configuration
    kustomize:
      version: v5.0.0
      
      commonLabels:
        app.kubernetes.io/name: buildtovalue
        app.kubernetes.io/version: "2.0.0"
        app.kubernetes.io/managed-by: argocd
      
      # ✅ CORRIGIDO: Nome da imagem consistente com deployment
      images:
        - buildtovalue=ghcr.io/buildtovalue/api:v2.0.0
  
  # ═══════════════════════════════════════════════════════════════════════
  # Destination (Kubernetes Cluster)
  # ═══════════════════════════════════════════════════════════════════════
  destination:
    server: https://kubernetes.default.svc
    
    # ✅ CORRIGIDO: Namespace unificado (buildtovalue)
    namespace: buildtovalue
  
  # ═══════════════════════════════════════════════════════════════════════
  # Sync Policy (Automated GitOps)
  # ═══════════════════════════════════════════════════════════════════════
  syncPolicy:
    automated:
      prune: true      # Delete resources not in Git
      selfHeal: true   # Auto-sync if cluster drifts from Git
      allowEmpty: false
    
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
    
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  # ═══════════════════════════════════════════════════════════════════════
  # Health Assessment
  # ═══════════════════════════════════════════════════════════════════════
  health:
    checks:
      # ✅ CORRIGIDO: Nome do deployment correto (buildtovalue, não buildtovalue-api)
      - kind: Deployment
        name: buildtovalue
        namespace: buildtovalue
        healthyThreshold: 2
      
      # ⚠️ Comentado: postgres não está deployado ainda
      # - kind: StatefulSet
      #   name: postgres
      #   namespace: buildtovalue
      #   healthyThreshold: 1
  
  # ═══════════════════════════════════════════════════════════════════════
  # Ignore Differences (Expected Drift)
  # ═══════════════════════════════════════════════════════════════════════
  ignoreDifferences:
    # Ignore HPA replica count (dynamic)
    - group: apps
      kind: Deployment
      name: buildtovalue
      jsonPointers:
        - /spec/replicas
    
    # Ignore secret data (sealed-secrets manages)
    - group: ""
      kind: Secret
      jqPathExpressions:
        - .data

---
# ════════════════════════════════════════════════════════════════════════════
# ArgoCD AppProject
# ════════════════════════════════════════════════════════════════════════════

apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: buildtovalue
  namespace: argocd
spec:
  description: BuildToValue Trust OS v2.0
  
  # ═══════════════════════════════════════════════════════════════════════
  # Source Repositories (Git)
  # ═══════════════════════════════════════════════════════════════════════
  sourceRepos:
    # ✅ CORRIGIDO: Seu repositório real
    - https://github.com/danzeroum/BuildToValueGovernance
    - '*'  # Permite qualquer repo (ajuste conforme necessário)
  
  # ═══════════════════════════════════════════════════════════════════════
  # Allowed Destinations
  # ═══════════════════════════════════════════════════════════════════════
  destinations:
    # ✅ CORRIGIDO: Namespace unificado
    - namespace: buildtovalue
      server: https://kubernetes.default.svc
    
    # Staging (se necessário)
    - namespace: buildtovalue-staging
      server: https://kubernetes.default.svc
  
  # ═══════════════════════════════════════════════════════════════════════
  # Allowed Resource Types
  # ═══════════════════════════════════════════════════════════════════════
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  
  namespaceResourceWhitelist:
    - group: ""
      kind: "*"
    
    - group: apps
      kind: "*"
    
    - group: batch
      kind: "*"
    
    - group: networking.k8s.io
      kind: "*"
    
    - group: autoscaling
      kind: "*"
  
  # ═══════════════════════════════════════════════════════════════════════
  # Roles (RBAC for ArgoCD)
  # ═══════════════════════════════════════════════════════════════════════
  roles:
    # Developers (read-only)
    - name: developer
      description: Developers can view applications
      policies:
        - p, proj:buildtovalue:developer, applications, get, buildtovalue/*, allow
        - p, proj:buildtovalue:developer, applications, sync, buildtovalue/*, deny
      
      groups:
        - buildtovalue-developers
    
    # SRE (full access)
    - name: sre
      description: SRE can manage applications
      policies:
        - p, proj:buildtovalue:sre, applications, *, buildtovalue/*, allow
      
      groups:
        - buildtovalue-sre
