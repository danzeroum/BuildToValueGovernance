
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buildtovalue-ledger-pvc
  namespace: buildtovalue
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd  # Substitua pela sua StorageClass
  resources:
    requests:
      storage: 50Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buildtovalue-explanations-pvc
  namespace: buildtovalue
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 100Gi