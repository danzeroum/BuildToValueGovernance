# ════════════════════════════════════════════════════════════════════════════
# BuildToValue v2.0 - Kustomization Base
# ════════════════════════════════════════════════════════════════════════════
# CORRIGIDO: Resources existentes + Namespace unificado + Images consistentes
# ════════════════════════════════════════════════════════════════════════════

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ✅ CORRIGIDO: Namespace unificado (buildtovalue em todos os ambientes)
namespace: buildtovalue

# ════════════════════════════════════════════════════════════════════════════
# Common Labels
# ════════════════════════════════════════════════════════════════════════════
commonLabels:
  app.kubernetes.io/name: buildtovalue
  app.kubernetes.io/component: trust-os
  app.kubernetes.io/part-of: buildtovalue-platform
  app.kubernetes.io/version: "2.0.0"

# ════════════════════════════════════════════════════════════════════════════
# Resources (✅ CORRIGIDO: Apenas arquivos que EXISTEM)
# ════════════════════════════════════════════════════════════════════════════
resources:
  # Core resources
  - ../00-namespace.yaml
  - ../10-deployment.yaml
  - ../20-service.yaml
  - ../30-pvc.yaml
  - ../40-hpa.yaml
  
  # Security (✅ CORRIGIDO: Arquivos separados do security/)
  - ../security/pod-security-standards.yaml  # Substituiu PSP obsoleta
  - ../security/network-policy.yaml
  - ../security/rbac.yaml
  
  # ⚠️ CRIAR ESTES ARQUIVOS (ou comentar se não precisar agora):
  # - ../05-profiles-configmap.yaml  # ConfigMap de profiles
  # - ../41-postgres.yaml            # StatefulSet Postgres
  # - ../42-redis.yaml               # StatefulSet Redis
  # - ../43-pdb.yaml                 # PodDisruptionBudget

# ════════════════════════════════════════════════════════════════════════════
# ❌ REMOVIDO: configMapGenerator (ConfigMap está em 00-namespace.yaml)
# ❌ REMOVIDO: secretGenerator (usar SealedSecret em produção)
# ════════════════════════════════════════════════════════════════════════════
# MOTIVO: Evita duplicação e conflitos

# ════════════════════════════════════════════════════════════════════════════
# Images (✅ CORRIGIDO: Nomes consistentes com deployment)
# ════════════════════════════════════════════════════════════════════════════
images:
  # ✅ Nome 'buildtovalue' bate com o deployment (10-deployment.yaml linha 48)
  - name: buildtovalue
    newName: ghcr.io/buildtovalue/api
    newTag: v2.0.0

# ════════════════════════════════════════════════════════════════════════════
# Annotations Comuns
# ════════════════════════════════════════════════════════════════════════════
commonAnnotations:
  buildtovalue.io/version: "2.0.0"
  buildtovalue.io/managed-by: "kustomize"
