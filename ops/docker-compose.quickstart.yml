# BTV Quickstart — demo leve sem GPU, sem nginx, sem observabilidade
# Uso: docker compose -f ops/docker-compose.quickstart.yml up -d
# Dashboard:     http://localhost:8501
# Gateway:       http://localhost:8080
# Upstream mock: http://localhost:8082  (httpbin — ecoa requests para testes E2E)
#
# Selecionar bundle de política:
#   BTV_POLICY_BUNDLE=gdpr_art22_chatbot docker compose -f ops/docker-compose.quickstart.yml up -d
#   BTV_POLICY_BUNDLE=hipaa_phi_audit    docker compose -f ops/docker-compose.quickstart.yml up -d
# Bundles disponíveis: baseline_trust (padrão), gdpr_art22_chatbot, hipaa_phi_audit

services:
  governance:
    build:
      context: ..
      dockerfile: ops/Dockerfile.python-quickstart
    ports:
      - "8000:8000"
    environment:
      BTV_HMAC_KEY: "demo-key-NOT-for-production-!!!!!"
      BTV_ENV: "development"
      BTV_POLICY_DIR: "/app/data/policies"
      BTV_DB_PATH: "/app/data/runtime/trust.db"
      BTV_APPEALS_DB: "/app/data/runtime/appeals.db"
      BTV_THREATS_DB: "/app/data/runtime/threats.db"
    volumes:
      - ../data/policies/quickstart/bundles/${BTV_POLICY_BUNDLE:-baseline_trust}:/app/data/policies:ro
      - ledger_data:/app/data/ledger
      - runtime_data:/app/data/runtime
    healthcheck:
      test:
        - "CMD"
        - "python3.11"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  upstream-mock:
    image: kennethreitz/httpbin
    ports:
      - "8082:80"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/status/200"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build:
      context: ..
      dockerfile: ops/Dockerfile.rust
    ports:
      - "8080:8080"
    environment:
      BTV_HMAC_KEY: "demo-key-NOT-for-production-!!!!!"
      BTV_ENV: "development"
      BTV_GOVERNANCE_URL: "http://governance:8000"
      BTV_PROXY_UPSTREAM_URL: "http://upstream-mock:80"
      BTV_POLICY_DIR: "/app/data/policies"
      RUST_LOG: "btv_gateway=info"
    volumes:
      - ../data/policies/quickstart/bundles/${BTV_POLICY_BUNDLE:-baseline_trust}:/app/data/policies:ro
      - ledger_data:/app/data/ledger
    depends_on:
      governance:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  dashboard:
    build:
      context: ..
      dockerfile: ops/Dockerfile.streamlit-demo
    ports:
      - "8501:8501"
    environment:
      BTV_GATEWAY_URL: "http://gateway:8080"
      BTV_GOVERNANCE_URL: "http://governance:8000"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  ledger_data:
  runtime_data:
