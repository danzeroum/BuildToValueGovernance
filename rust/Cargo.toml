[workspace]
members = ["kernel", "bindings", "cli", "gateway"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["BuildToValue Team <team@buildtovalue.com>"]
license = "Apache-2.0"

[workspace.dependencies]
# Core
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
serde_yaml = "0.9"
pyo3 = { version = "0.20", features = ["extension-module"] }
prost = "0.12"
phf = { version = "0.11", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"
tokio = { version = "1.44.0", features = ["rt", "rt-multi-thread", "macros", "sync"] }
anyhow = "1.0"
lazy_static = "1.5.0"
arc-swap = "1.7"
log = "0.4"
regex = "1.10"
base64 = "0.22"
hex = "0.4"
ring = "0.17"
rand = "0.8"
spin_sleep = "1.1"
unicode-normalization = "0.1"
static_assertions = "1.1"
tempfile = "3.10"
uuid = { version = "1.8", features = ["v4"] }
dotenv = "0.15"
bincode = "1.3.3"
sha2 = "0.10"

# CLI
clap = { version = "4", features = ["derive"] }
colored = "2.0"

# FFI (build‑time only)
maturin = "1.5"

# Observability
prometheus = "0.13"
opentelemetry = "0.21"
opentelemetry_sdk = "0.21"
opentelemetry-otlp = "0.14"
tracing-opentelemetry = "0.22"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# AWS
aws-sdk-s3 = "1.123.0"
aws-config = "1.8.14"

# Dev
criterion = "0.5"