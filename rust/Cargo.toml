[workspace]
resolver = "2"
members = [
    "kernel",
    "bindings",
    "cli"
]

# Configurações comuns para todos os pacotes
[workspace.package]
version = "2.3.1"
edition = "2021"
authors = ["BuildToValue Team"]
license = "Proprietary"

# Dependências comuns que podem ser herdadas
[workspace.dependencies]
# Core
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["full"] }

# CLI
clap = { version = "4.4", features = ["derive"] }
colored = "2.1"

# Python bindings
pyo3 = { version = "0.20", features = ["extension-module"] }
prost = "0.12"

# Observability
tracing = "0.1"
tracing-subscriber = "0.3"

# Utilities
dotenv = "0.15"
lazy_static = "1.4"
chrono = { version = "0.4", features = ["serde"] }