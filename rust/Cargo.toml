[workspace]
resolver = "2"
members = [
    "kernel",
    "bindings",
    "cli"
]

[workspace.package]
version = "2.3.2"
edition = "2021"
authors = ["BuildToValue Team"]
license = "Proprietary"

[workspace.dependencies]
# Core & Error Handling
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.36", features = ["full", "rt-multi-thread", "macros", "sync"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
lazy_static = "1.4"
static_assertions = "1.1"

# Crypto & Hashing
blake3 = "1.5"
hex = "0.4"
base64 = "0.22"
rand = "0.8"

# Pattern Matching & Parsing
regex = "1.10"
phf = { version = "0.11", features = ["macros"] }

# Logging & Tracing
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = "0.3"

# CLI & Configuration (ADICIONADO PARA CORRIGIR O ERRO)
clap = { version = "4.4", features = ["derive"] }
colored = "2.1"
dotenv = "0.15"

# FFI
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py310"] }
prost = "0.12"

# Cloud (Optional)
aws-config = "1.1"
aws-sdk-s3 = "1.14"

[workspace.dev-dependencies]
tempfile = "3.10"
mockall = "0.12"