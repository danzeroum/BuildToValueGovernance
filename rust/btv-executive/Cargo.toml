[package]
name = "btv-executive"
version.workspace = true
edition.workspace = true
description = "Executive power: sole decision pipeline (Paper 5, Theorem 3.5 — Executive Containment)"

[dependencies]
btv-types  = { path = "../btv-types" }
btv-core   = { path = "../btv-core", features = ["log-client"] }
# Re-uses kernel scan infrastructure rather than duplicating it.
# The kernel crate is NOT the executive: it produces TechnicalEvidence.
# btv-executive wraps those findings in constitutional types.
buildtovalue-kernel = { path = "../kernel" }
blake3     = { workspace = true }
tokio      = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
reqwest    = { workspace = true }
thiserror  = { workspace = true }
hex        = { workspace = true }

[dev-dependencies]
trybuild         = "1"
criterion        = { workspace = true }
tokio            = { workspace = true }
ed25519-dalek    = { workspace = true }

[[bench]]
name    = "executive"
harness = false
