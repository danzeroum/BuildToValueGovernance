[package]
name = "buildtovalue-kernel"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "BuildToValue Sovereign Kernel - Core validation engine"
license.workspace = true

[features]
default = []
# ✅ Uso de 'dep:' para evitar que features tenham o mesmo nome que as libs (Rust 2021+)
ffi-bindings = ["dep:pyo3", "dep:prost"]
python = ["ffi-bindings"]
observability = ["dep:tracing", "dep:tracing-subscriber", "dep:prometheus"]

[dependencies]
# ═══════════════════════════════════════════════════════════════════════════
# CORE (Sempre Ativos)
# ═══════════════════════════════════════════════════════════════════════════
blake3 = "1.5"
phf = { version = "0.11", features = ["macros"] }
regex = "1.10"
base64 = "0.21"
hex = "0.4"
ring = "0.17"
rand = "0.8"
spin_sleep = "1.1"
unicode-normalization = "0.1"

# ═══════════════════════════════════════════════════════════════════════════
# WORKSPACE INHERITANCE (Herdado do Cargo.toml raiz)
# ═══════════════════════════════════════════════════════════════════════════
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
lazy_static = { workspace = true }
chrono = { workspace = true }
serde_bytes = "0.11"  # ✅ CRÍTICO para WalEntry
bincode = "1.3"       # ✅ CRÍTICO para serialização
crc32fast = "1.3"     # ✅ CRÍTICO para checksums
# ═══════════════════════════════════════════════════════════════════════════
# OPTIONAL (Ativados via Features)
# ═══════════════════════════════════════════════════════════════════════════
pyo3 = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
prometheus = { version = "0.13", optional = true }

# AWS S3 (Opcional - para ledger remoto)
aws-sdk-s3 = { version = "1.0", optional = true }

# ═══════════════════════════════════════════════════════════════════════════
# TARGET SPECIFIC
# ═══════════════════════════════════════════════════════════════════════════
[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winuser"] }