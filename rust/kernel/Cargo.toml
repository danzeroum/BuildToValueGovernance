[package]
name = "buildtovalue-kernel"
version = "2.0.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.36", features = ["full"] }
async-trait = "0.1"

# Serialização
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
serde_bytes = "0.11"

# Crypto & Security
blake3 = "1.5"
hmac = "0.12"
sha2 = "0.10"
crc32fast = "1.4"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Performance
once_cell = "1.19"
parking_lot = "0.12"

# Pattern matching
regex = "1.10"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Python FFI
pyo3 = { version = "0.21", features = ["extension-module"] }

[dev-dependencies]
proptest = "1.4"
criterion = "0.5"
tempfile = "3.10"

[lib]
name = "buildtovalue_kernel"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Policy engine
serde_yaml = "0.9"