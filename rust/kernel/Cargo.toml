[package]
name = "buildtovalue-kernel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []
ffi-bindings = ["dep:pyo3", "dep:prost"]
# Feature unificada de observabilidade
observability = [
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:prometheus"
]
# Feature para S3 Ledger
s3 = ["dep:aws-config", "dep:aws-sdk-s3"]

[dependencies]
# --- Core ---
blake3 = "1.5"
phf = { version = "0.11", features = ["macros"] }
regex = "1.10"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9" # Crítico para Policy Engine
anyhow = { workspace = true }
thiserror = { workspace = true }
lazy_static = { workspace = true }
chrono = { workspace = true }
static_assertions = "1.1"
log = "0.4"
async-trait = "0.1" # Necessário para remote/sync.rs

# --- Serialization for Ledger ---
bincode = "1.3"
serde_bytes = "0.11"
crc32fast = "1.3"

# --- Async Runtime ---
tokio = { workspace = true }

# --- Optional / Features ---
pyo3 = { workspace = true, optional = true }
prost = { workspace = true, optional = true }

aws-config = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }

tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"], optional = true }
# Versões compatíveis para evitar conflito
tracing-opentelemetry = { version = "0.22", optional = true }
opentelemetry = { version = "0.21", features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.21", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.14", features = ["tonic"], optional = true }
prometheus = { version = "0.13", optional = true }
metrics = "0.24.3"
uuid = { version = "1.20.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.10"
env_logger = "0.11"
mockall = "0.12"