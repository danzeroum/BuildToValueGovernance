[package]
name = "buildtovalue-kernel"
version = "2.3.1"
authors = ["BuildToValue Architecture Team"]
edition = "2021"

# Metadados do projeto (sincronizado com PROJECT_CONTEXT.md)
description = "Sovereign Kernel for BuildToValue Governance Platform v3.0"
repository = "https://github.com/buildtovalue/governance"
readme = "README.md"
license = "Apache-2.0"

# Features condicionais
[features]
default = []
observability = ["opentelemetry", "opentelemetry-otlp", "tracing-opentelemetry", "prometheus"]
ffi-bindings = ["pyo3"]
s3 = ["aws-sdk-s3"]

[dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
thiserror = "1.0"
anyhow = "1.0"
lazy_static = "1.4"
regex = "1.10"
blake3 = "1.5"
rand = "0.8"
uuid = { version = "1.7", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.21"
hex = "0.4"

# Observabilidade (feature-gated) - CORRIGIDO: opentelemetry_sdk (com underscore)
opentelemetry = { version = "0.20", optional = true }
opentelemetry-otlp = { version = "0.13", optional = true }
opentelemetry_sdk = { version = "0.20", optional = true }  # ✅ CORRIGIDO
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
tracing-opentelemetry = { version = "0.22", optional = true }
prometheus = { version = "0.13", optional = true }

# FFI (feature-gated)
pyo3 = { version = "0.20", features = ["extension-module"], optional = true }

# AWS S3 (feature-gated)
aws-sdk-s3 = { version = "0.36", optional = true }
aws-config = { version = "0.56", optional = true }

# Test utilities
tempfile = { version = "3.10", optional = true }
static_assertions = "1.1"

[dev-dependencies]
tempfile = "3.10"

[lib]
crate-type = ["cdylib", "rlib"]
name = "buildtovalue_kernel"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1