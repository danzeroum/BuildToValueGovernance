
groups:
  - name: compliance-alerts
    interval: 30s
    rules:
      - alert: ComplianceCalculationLatencyHigh
        expr: histogram_quantile(0.99, rate(compliance_penalty_calculation_duration_seconds_bucket[5m])) > 0.001
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Compliance calculation latency > 1ms (p99)"
          description: "Penalty calculation exceeding SLA. Current: {{ $value }}s"
      
      - alert: WALRecoveryFailed
        expr: increase(compliance_wal_recovery_errors_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "WAL recovery failed - potential data loss"
          description: "Threat ingestor failed to recover from WAL"
      
      - alert: AJLComplianceRateDropped
        expr: compliance_ajl_compliance_rate < 0.95
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "AJL compliance rate < 95%"
          description: "Certification at risk. Current: {{ $value }}"