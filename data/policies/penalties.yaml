# data/policies/penalties.yaml
# ═══════════════════════════════════════════════════════════════
# Regulatory Penalty Schedules — BuildToValue v3.0
# ═══════════════════════════════════════════════════════════════
#
# SINGLE SOURCE OF TRUTH for penalty values.
# Consumed by: Rust PenaltyCalculator + Python ROI Engine.
#
# Philosophy: Jonas — responsibility proportional to risk.
# Methodology: Conservative FAIR-based estimation.
#   - per_incident = 0.1–0.5% of max_penalty (conservative)
#   - confidence = based on enforcement history
#
# Currency: USD (converted at schedule creation date)
# Update cycle: Quarterly or on regulatory change.
# ═══════════════════════════════════════════════════════════════

_metadata:
  version: "1.0.0"
  created_at: "2026-02-17"
  updated_at: "2026-02-17"
  methodology: "Conservative FAIR-based estimation"
  currency: "USD"
  update_cycle_days: 90
  sources:
    - "LGPD Lei 13.709/2018, Art. 52"
    - "GDPR Regulation EU 2016/679, Art. 83"
    - "EU AI Act, Art. 71 (fines for prohibited practices)"
    - "HIPAA 45 CFR §160.404"
    - "PCI-DSS v4.0 contractual penalties"
    - "NIST AI RMF 1.0 (risk-based framework, no direct fines)"

# ═══════════════════════════════════════════════════════════════
# LGPD — Lei Geral de Proteção de Dados (Brazil)
# ═══════════════════════════════════════════════════════════════

lgpd:
  framework_id: "LGPD"
  authority: "ANPD (Autoridade Nacional de Proteção de Dados)"
  legal_basis: "Lei 13.709/2018"
  max_global_penalty: "2% of revenue, capped at R$50M per infraction"

  penalties:
    pii_leakage:
      description: "Personal data breach or unauthorized disclosure"
      legal_ref: "Art. 52, I-II"
      max_penalty_usd: 25_000_000  # R$50M ≈ $25M
      per_incident_usd: 50_000     # 0.2% of max
      confidence: 0.85
      severity_multipliers:
        low: 0.5
        medium: 1.0
        high: 2.0
        critical: 3.0

    denial_of_wallet:
      description: "Improper data retention beyond purpose"
      legal_ref: "Art. 16 (data elimination)"
      max_penalty_usd: 10_000_000
      per_incident_usd: 25_000
      confidence: 0.75

    consent_violation:
      description: "Processing without valid legal basis"
      legal_ref: "Art. 7-8 (consent requirements)"
      max_penalty_usd: 25_000_000
      per_incident_usd: 40_000
      confidence: 0.80

# ═══════════════════════════════════════════════════════════════
# GDPR — General Data Protection Regulation (EU)
# ═══════════════════════════════════════════════════════════════

gdpr:
  framework_id: "GDPR"
  authority: "National DPAs + EDPB"
  legal_basis: "Regulation EU 2016/679"
  max_global_penalty: "€20M or 4% of global turnover"

  penalties:
    pii_leakage:
      description: "Personal data breach (Art. 33-34 notification failure)"
      legal_ref: "Art. 83(5)"
      max_penalty_usd: 25_000_000  # €20M ≈ $25M
      per_incident_usd: 50_000
      confidence: 0.85

    consent_violation:
      description: "Processing without valid legal basis"
      legal_ref: "Art. 83(5)(a)"
      max_penalty_usd: 25_000_000
      per_incident_usd: 40_000
      confidence: 0.80

    prompt_injection:
      description: "Security failure allowing unauthorized data access"
      legal_ref: "Art. 32 (security of processing) + Art. 83(4)"
      max_penalty_usd: 12_500_000  # €10M ≈ $12.5M
      per_incident_usd: 30_000
      confidence: 0.75

    data_subject_rights_violation:
      description: "Failure to honor data subject requests"
      legal_ref: "Art. 83(5)(b)"
      max_penalty_usd: 25_000_000
      per_incident_usd: 35_000
      confidence: 0.80

# ═══════════════════════════════════════════════════════════════
# EU AI Act
# ═══════════════════════════════════════════════════════════════

eu_ai_act:
  framework_id: "EU_AI_ACT"
  authority: "National Market Surveillance Authorities + AI Office"
  legal_basis: "Regulation EU 2024/1689"
  max_global_penalty: "€35M or 7% of global turnover (prohibited practices)"

  penalties:
    prohibited_ai_practice:
      description: "Deploying prohibited AI system (Art. 5)"
      legal_ref: "Art. 99(3)"
      max_penalty_usd: 40_000_000  # €35M ≈ $40M
      per_incident_usd: 150_000
      confidence: 0.90

    shadow_ai:
      description: "Unregistered high-risk AI system"
      legal_ref: "Art. 99(4) — high-risk non-compliance"
      max_penalty_usd: 17_500_000  # €15M ≈ $17.5M
      per_incident_usd: 75_000
      confidence: 0.85

    bias_violation:
      description: "Discriminatory output from high-risk AI"
      legal_ref: "Art. 10 (data governance) + Art. 99(4)"
      max_penalty_usd: 17_500_000
      per_incident_usd: 60_000
      confidence: 0.80

    transparency_failure:
      description: "Failure to inform users of AI interaction"
      legal_ref: "Art. 50 + Art. 99(4)"
      max_penalty_usd: 8_500_000  # €7.5M ≈ $8.5M
      per_incident_usd: 25_000
      confidence: 0.85

# ═══════════════════════════════════════════════════════════════
# HIPAA — Health Insurance Portability and Accountability Act
# ═══════════════════════════════════════════════════════════════

hipaa:
  framework_id: "HIPAA"
  authority: "HHS Office for Civil Rights (OCR)"
  legal_basis: "45 CFR §160.404"
  max_global_penalty: "$1.5M per violation category per year"

  penalties:
    phi_disclosure:
      description: "Unauthorized disclosure of Protected Health Information"
      legal_ref: "§164.502 + §160.404"
      max_penalty_usd: 1_500_000
      per_incident_usd: 50_000
      confidence: 0.90

    minimum_necessary_violation:
      description: "Accessing more PHI than needed"
      legal_ref: "§164.502(b)"
      max_penalty_usd: 1_500_000
      per_incident_usd: 25_000
      confidence: 0.85

    breach_notification_failure:
      description: "Failure to notify within 60 days"
      legal_ref: "§164.404"
      max_penalty_usd: 1_500_000
      per_incident_usd: 40_000
      confidence: 0.90

# ═══════════════════════════════════════════════════════════════
# PCI-DSS — Payment Card Industry Data Security Standard
# ═══════════════════════════════════════════════════════════════

pci_dss:
  framework_id: "PCI_DSS"
  authority: "PCI Security Standards Council (contractual)"
  legal_basis: "PCI-DSS v4.0"
  max_global_penalty: "$100K-$500K/month (contractual, varies by acquirer)"

  penalties:
    card_data_breach:
      description: "Cardholder data exposure"
      legal_ref: "Req. 3-4 (protect stored/transmitted data)"
      max_penalty_usd: 500_000
      per_incident_usd: 25_000
      confidence: 0.85

    encryption_failure:
      description: "Failure to encrypt cardholder data"
      legal_ref: "Req. 3.5, 4.1"
      max_penalty_usd: 500_000
      per_incident_usd: 15_000
      confidence: 0.80

# ═══════════════════════════════════════════════════════════════
