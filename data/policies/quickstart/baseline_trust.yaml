id: baseline_trust
name: "Baseline Trust"
description: "Bundle mínimo para demo: bloqueia crédito sem explicação, redige CPF, permite o restante."
parent_id: base

version: "1.0.0"
created_at: "2026-05-17"
updated_at: "2026-05-17"

rules:
  - id: "BLOCK_CREDIT_DECISION_NO_EXPLANATION"
    name: "Block Unexplained Credit Decision"
    description: "Decisão de crédito sem explicação humana é bloqueada (transparência mínima)"
    action: BLOCK
    priority: 400
    categories: ["financial", "credit"]
    min_severity: 0.6
    min_confidence: 0.7

  - id: "REDACT_CPF_BASELINE"
    name: "Redact CPF"
    description: "CPF é sempre redigido antes de sair do sistema"
    action: REDACT
    priority: 300
    validators: ["cpf"]
    categories: ["pii"]
    min_severity: 0.5
    min_confidence: 0.8

  - id: "BLOCK_CREDIT_CARD_BASELINE"
    name: "Block Credit Card"
    description: "Número de cartão nunca é legítimo em output"
    action: BLOCK
    priority: 350
    validators: ["credit_card"]
    categories: ["financial"]
    min_severity: 0.8
    min_confidence: 0.9

  - id: "ALLOW_DEFAULT"
    name: "Allow Default"
    description: "Permite tudo que não foi bloqueado ou redigido pelas regras acima"
    action: ALLOW
    priority: 1
    categories: []

domain_config:
  general:
    risk_multiplier: 1.0
    contestability_enabled: false
    education_message: "Bundle de demo. Para produção, use um bundle específico ao seu setor."
