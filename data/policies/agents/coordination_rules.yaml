# Coordination Rules — Gap D (Multi-Agent Coordination)
# Circuit breaker and conflict detection settings.

schema_version: "1.0"

# Circuit breaker
circuit_breaker:
  failure_threshold: 5      # failures within window triggers open
  window_s: 60              # time window for counting failures
  cooldown_s: 30            # time to wait before retrying after trip
  half_open_max: 2          # requests allowed in half-open state

# Conflict detection
conflict_rules:
  - action_a: "model_deploy"
    action_b: "model_deploy"
    conflict: true
    reason: "Concurrent model deploys forbidden"

  - action_a: "training_cycle_start"
    action_b: "lora_deploy"
    conflict: true
    reason: "Cannot deploy while training"

# Byzantine Fault Tolerance — Scenario 4 (Robótica BFT)
# Requires 2/3 consensus before any critical single-agent action.
bft:
  min_consensus_fraction: 0.67          # 2/3 of agents must agree
  byzantine_fault_tolerance: true
  max_faulty_agents_fraction: 0.33      # tolerates up to 33% Byzantine agents
  block_on_single_agent_critical_action: true  # solo critical actions = BLOCK
