version: "1.6"
metadata:
  name: "BTV Core Policies"
  description: "Default policy set for Sovereign Trust OS"
  created_at: "2026-02-15"
  updated_at: "2026-02-15"
  author: "BuildToValue Architecture Team"

hard_blocks:
  - "DROP TABLE"
  - "DELETE FROM"
  - "<script>"
  - "javascript:"
  - "eval("
  - "UNION SELECT"
  - "1=1"
  - "OR 1=1"
  - "cmd.exe"
  - "/etc/passwd"
  - "../../"
  - "rm -rf"
  - "ignore as instruções anteriores"
  - "desconsidere suas regras"
  - "ignore previous instructions"
  - "forget all previous"
  - "system: you are now"
  - "senha:"
  - "password:"
  - "login: root"

policies:
  - id: "block-cpf-high"
    name: "Block CPF with high confidence"
    description: "Block valid CPF detection above 90% confidence"
    enabled: true
    priority: 100
    conditions:
      validators: ["cpf"]
      min_severity: 0.5
      min_confidence: 0.9
    action: BLOCK

  - id: "block-credit-card"
    name: "Block credit card numbers"
    description: "Block any credit card detection"
    enabled: true
    priority: 100
    conditions:
      validators: ["creditcard"]
      min_severity: 0.3
      min_confidence: 0.8
    action: BLOCK

  - id: "redact-cnpj"
    name: "Redact CNPJ"
    description: "Redact CNPJ numbers in output"
    enabled: true
    priority: 80
    conditions:
      validators: ["cnpj"]
      min_severity: 0.5
      min_confidence: 0.85
    action: REDACT

  - id: "redact-email"
    name: "Redact email addresses"
    description: "Mask email addresses in responses"
    enabled: true
    priority: 70
    conditions:
      validators: ["email"]
      min_severity: 0.3
      min_confidence: 0.8
    action: REDACT

  - id: "log-phone"
    name: "Log phone detection"
    description: "Log phone number detections for audit"
    enabled: true
    priority: 50
    conditions:
      validators: ["phone"]
      min_severity: 0.3
      min_confidence: 0.7
    action: LOG

  - id: "educate-low-risk"
    name: "Educate on low-risk findings"
    description: "Send educational message for low-confidence findings"
    enabled: true
    priority: 10
    conditions:
      validators: []
      min_severity: 0.1
      min_confidence: 0.3
    action: EDUCATE

  # ── Jurisdiction-gated validators (ADR-035, integrated in gatekeeper v2.2) ──
  # These policies are only active when the corresponding jurisdiction bitmask
  # is set in the scan context (JURISDICTION_UK, JURISDICTION_EU).
  - id: "redact-nhs"
    name: "Redact NHS numbers"
    description: "Redact UK NHS health identifiers (Modulo 11 checksum)"
    enabled: true
    priority: 90
    conditions:
      validators: ["nhs"]
      min_severity: 0.5
      min_confidence: 0.9
      jurisdiction: "UK"
    action: REDACT

  - id: "redact-vat"
    name: "Redact EU VAT numbers"
    description: "Redact EU VAT registration numbers"
    enabled: true
    priority: 80
    conditions:
      validators: ["vat"]
      min_severity: 0.5
      min_confidence: 0.85
      jurisdiction: "EU"
    action: REDACT

  - id: "redact-iban"
    name: "Redact IBAN numbers"
    description: "Redact International Bank Account Numbers (ISO 13616 Modulo 97)"
    enabled: true
    priority: 85
    conditions:
      validators: ["iban"]
      min_severity: 0.5
      min_confidence: 0.9
      jurisdiction: "EU"
    action: REDACT