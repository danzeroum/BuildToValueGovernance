# BuildToValue v3.0 - ISO 42001 Base Compliance Profile
# ISO/IEC 42001:2023 - AI Management System
#
# Version: 2.0.0 (gap-closed)
# Last Updated: 2026-02-17

id: iso_42001_base
name: ISO 42001 Base Compliance Profile
description: |
  ISO/IEC 42001:2023 - AI Management System.
  Full coverage: Context (4), Leadership (5), Planning (6),
  Support (7), Operation (8), Evaluation (9), Improvement (10),
  Annex A AI-specific controls.

parent_id: null
version: 2.0.0
legal_framework: ISO_42001
jurisdiction: INTERNATIONAL
created_at: 2026-02-05
updated_at: 2026-02-17

legal_metadata:
  standard_name: "Artificial Intelligence Management System"
  standard_number: "ISO/IEC 42001:2023"
  standard_url: "https://www.iso.org/standard/81230.html"
  certification_body: "ISO (International Organization for Standardization)"
  publication_date: "2023-12-18"

  scope:
    - "AI system development lifecycle"
    - "Risk management for AI"
    - "Data governance"
    - "Transparency and explainability"
    - "Human oversight"
    - "Continuous monitoring"

  certification:
    type: "Third-party certification available"
    validity: "3 years (with annual surveillance audits)"

  penalties: []  # Voluntary standard

domain_config:
  general:
    risk_multiplier: 1.0
    require_ai_officer: true
    require_risk_assessment: true
    model_documentation_mandatory: true

  ai_lifecycle_stages:
    - "Planning"
    - "Design"
    - "Development"
    - "Verification"
    - "Deployment"
    - "Operation"
    - "Monitoring"
    - "Maintenance"
    - "Decommissioning"

rules:
  # ═══════════════════════════════════════════════════════════════
  # CLAUSE 4: CONTEXT [GAP CLOSED]
  # ═══════════════════════════════════════════════════════════════

  - id: ISO42001_4_1_CONTEXT
    name: "Document AI System Context"
    description: "Understanding organization and its context for AI (Clause 4.1)"
    action: ESCALATE
    priority: 75
    severity: MEDIUM
    validators: ["documentation_validator"]
    condition: |
      agent.context_documented == false or
      agent.stakeholders_identified == false
    legal_basis: "ISO/IEC 42001:2023 Clause 4.1"
    contestable: false
    mercy_eligible: true
    uncertainty_threshold: 0.6
    rationale: |
      Foundational: cannot manage AI risk without understanding context.
      Mercy: If partial documentation exists, EDUCATE + 30-day deadline.

  - id: ISO42001_4_2_STAKEHOLDERS
    name: "Stakeholder Requirements Captured"
    description: "Understanding needs of interested parties (Clause 4.2)"
    action: LOG
    priority: 65
    severity: MEDIUM
    validators: ["stakeholder_validator"]
    condition: |
      agent.stakeholder_requirements_reviewed == false or
      days_since(agent.last_stakeholder_review) > 180
    legal_basis: "ISO/IEC 42001:2023 Clause 4.2"
    contestable: false
    mercy_eligible: false
    rationale: |
      Bi-annual stakeholder review recommended.

  # ═══════════════════════════════════════════════════════════════
  # CLAUSE 5: LEADERSHIP [GAP CLOSED]
  # ═══════════════════════════════════════════════════════════════

  - id: ISO42001_5_1_LEADERSHIP
    name: "AI Governance Structure Established"
    description: "Top management commitment to AI management (Clause 5.1)"
    action: LOG
    priority: 70
    severity: MEDIUM
    validators: []
    condition: |
      organization.ai_governance_board_exists == false
    legal_basis: "ISO/IEC 42001:2023 Clause 5.1"
    contestable: false
    mercy_eligible: false
    rationale: |
      Leadership accountability = foundational for all other clauses.

  - id: ISO42001_5_2_AI_POLICY
    name: "AI Policy Document Current"
    description: "Establish and maintain AI policy (Clause 5.2)"
    action: ESCALATE
    priority: 80
    severity: MEDIUM
    validators: ["policy_validator"]
    condition: |
      organization.ai_policy_version_date == null or
      days_since(organization.ai_policy_version_date) > 365
    legal_basis: "ISO/IEC 42001:2023 Clause 5.2"
    contestable: false
    mercy_eligible: true
    uncertainty_threshold: 0.6
    rationale: |
      Annual AI policy review required.
      Mercy: If review scheduled, EDUCATE + track.

  - id: ISO42001_5_3_ROLES
    name: "AI Roles and Responsibilities Assigned"
    description: "Roles, responsibilities, authorities for AI management (Clause 5.3)"
    action: BLOCK
    priority: 90
    severity: HIGH
    validators: ["role_assignment_validator"]
    condition: |
      agent.owner_assigned == false or
      agent.data_protection_officer_assigned == false
    legal_basis: "ISO/IEC 42001:2023 Clause 5.3"
    contestable: false
    mercy_eligible: false
    rationale: |
      Jonas (Responsibility): Every AI system must have designated owner and DPO.

  # ═══════════════════════════════════════════════════════════════
  # CLAUSE 6: PLANNING
  # ═══════════════════════════════════════════════════════════════

  - id: ISO42001_6_1_RISK_ASSESSMENT
    name: "AI Risk Assessment Required"
    description: "Conduct comprehensive AI risk assessment (Clause 6.1)"
    action: ESCALATE
    priority: 95
    severity: HIGH
    validators: ["risk_assessment_validator"]
    condition: |
      ai_system.risk_assessment_completed == false and
      ai_system.deployment_stage in ["verification", "deployment"]
    legal_basis: "ISO/IEC 42001:2023 Clause 6.1"
    contestable: false
    mercy_eligible: true
    uncertainty_threshold: 0.8
    rationale: |
      Gilligan (Care): Risk assessment = understanding context before acting.
      Mercy: If partial assessment exists, EDUCATE to complete.

  - id: ISO42001_6_1_3_IMPACT_ASSESSMENT
    name: "AI Impact Assessment Required"
    description: "Impact assessment for AI systems processing personal data (Clause 6.1.3)"
    action: ESCALATE
    priority: 90
    severity: HIGH
    validators: ["impact_assessment_validator"]
    condition: |
      agent.processes_personal_data == true and
      agent.impact_assessment_completed == false
    legal_basis: "ISO/IEC 42001:2023 Clause 6.1.3"
    contestable: false
    mercy_eligible: true
    uncertainty_threshold: 0.7
    rationale: |
      DPIA required when processing personal data. Aligns with GDPR Art. 35.

  - id: ISO42001_6_2_AI_OBJECTIVES
    name: "AI Objectives Documentation"
    description: "Document AI system objectives and success criteria (Clause 6.2)"
    action: LOG
    priority: 70
    severity: MEDIUM
    validators: ["documentation_validator"]
    condition: |
      ai_system.objectives_documented == false
    legal_basis: "ISO/IEC 42001:2023 Clause 6.2"
    contestable: false
    mercy_eligible: false

  # ═══════════════════════════════════════════════════════════════
  # CLAUSE 7: SUPPORT [GAPS CLOSED]
  # ═══════════════════════════════════════════════════════════════

  - id: ISO42001_7_2_COMPETENCE
    name: "AI Team Competence Requirements"
    description: "Ensure personnel have necessary AI competence (Clause 7.2)"
    action: ESCALATE
    priority: 80
    severity: MEDIUM
    validators: ["competence_validator"]
    condition: |
      team.ai_training_completed == false or
      days_since(team.last_training) > 365
    legal_basis: "ISO/IEC 42001:2023 Clause 7.2"
    contestable: false
    mercy_eligible: true
    uncertainty_threshold: 0.6
    rationale: |
      Annual training mandatory. Mercy: If scheduled, EDUCATE + grace period.

  - id: ISO42001_7_3_AWARENESS
    name: "AI Awareness Training"
    description: "Workers aware of AI policy and their role (Clause 7.3)"
    action: LOG
    priority: 65
    severity: MEDIUM
    validators: ["training_validator"]
    condition: |
      user.ai_awareness_training_completed == false and
      user.works_with_ai == true
    legal_basis: "ISO/IEC 42001:2023 Clause 7.3"
    contestable: false
    mercy_eligible: false

  - id: ISO42001_7_4_COMMUNICATION
    name: "AI System Transparency Disclosure"
    description: "Users informed when interacting with AI (Clause 7.4)"
    action: LOG
    priority: 70
    severity: MEDIUM
    validators: ["transparency_validator"]
    condition: |
      agent.user_facing == true and
      agent.ai_disclosure_present == false
    legal_basis: "ISO/IEC 42001:2023 Clause 7.4"
    contestable: false
    mercy_eligible: false
    rationale: |
      Levinas (Care): Users have right to know about AI interaction.

  - id: ISO42001_7_5_DOCUMENTED_INFORMATION
    name: "AI System Documentation"
    description: "Maintain documented information on AI system (Clause 7.5)"
    action: ESCALATE
    priority: 90
    severity: HIGH
    validators: ["documentation_validator"]
    condition: |
      ai_system.documentation_complete == false and
      required_docs_missing > 0
    parameters:
      required_docs:
        - "Model card"
        - "Data provenance"
        - "Training methodology"
        - "Performance metrics"
        - "Bias testing results"
        - "Deployment procedures"
        - "Monitoring plan"
    legal_basis: "ISO/IEC 42001:2023 Clause 7.5"
    contestable: false
    mercy_eligible: true
    uncertainty_threshold: 0.7
    rationale: |
      Jonas (Responsibility): Documentation = accountability.
      Similar to BuildToValue BiasDeclaration.

  # ═══════════════════════════════════════════════════════════════
  # CLAUSE 8: OPERATION [GAPS CLOSED]
  # ═══════════════════════════════════════════════════════════════

  - id: ISO42001_8_1_DATA_GOVERNANCE
    name: "AI Data Governance"
    description: "Data governance for AI training/operation (Clause 8.1)"
    action: ESCALATE
    priority: 90
    severity: HIGH
    validators: ["data_quality_validator"]
    condition: |
      training_data.quality_validated == false or
      training_data.bias_tested == false or
      training_data.provenance_documented == false
    legal_basis: "ISO/IEC 42001:2023 Clause 8.1"
    contestable: false
    mercy_eligible: true
    uncertainty_threshold: 0.75
    rationale: |
      Gilligan (Care): Bad data = biased AI = harm to vulnerable groups.

  - id: ISO42001_8_2_TRANSPARENCY
    name: "AI Transparency Requirements"
    description: "Transparency about capabilities and limitations (Clause 8.2)"
    action: ESCALATE
    priority: 85
    severity: HIGH
    validators: ["transparency_validator"]
    condition: |
      ai_system.user_facing == true and
      (transparency_disclosure_provided == false or
       limitations_disclosed == false)
    legal_basis: "ISO/IEC 42001:2023 Clause 8.2"
    contestable: false
    mercy_eligible: false
    rationale: |
      Levinas (Care): Users have right to know system limitations.

  - id: ISO42001_8_3_HUMAN_OVERSIGHT
    name: "Human Oversight of AI Decisions"
    description: "Human oversight for high-impact AI decisions (Clause 8.3)"
    action: BLOCK
    priority: 95
    severity: HIGH
    validators: ["human_oversight_validator"]
    condition: |
      decision.is_ai_generated == true and
      decision.impact_level == "high" and
      decision.human_reviewed == false
    legal_basis: "ISO/IEC 42001:2023 Clause 8.3"
    contestable: false
    mercy_eligible: false
    rationale: |
      Gilligan (Care): Automated decisions lack context = human must review.

  - id: ISO42001_8_4_DEPLOYMENT_GATES
    name: "AI Development Lifecycle Gates"
    description: "Testing + Security + Ethics gates before deployment (Clause 8.4)"
    action: BLOCK
    priority: 95
    severity: CRITICAL
    validators: ["deployment_gate_validator"]
    condition: |
      agent.deployment_requested == true and
      (agent.testing_completed == false or
       agent.security_scan_passed == false or
       agent.ethics_review_passed == false)
    legal_basis: "ISO/IEC 42001:2023 Clause 8.4"
    contestable: false
    mercy_eligible: false
    rationale: |
      Jonas (Responsibility): No deployment without all gates passed.

  - id: ISO42001_8_5_SCOPE_CREEP
    name: "Prevent AI Scope Creep"
    description: "AI must operate within approved use cases (Clause 8.5)"
    action: ESCALATE
    priority: 80
    severity: HIGH
    validators: ["scope_validator"]
    condition: |
      agent.current_use_case not in agent.approved_use_cases
    legal_basis: "ISO/IEC 42001:2023 Clause 8.5"
    contestable: true
    mercy_eligible: true
    uncertainty_threshold: 0.7
    rationale: |
      Mercy: If use case is adjacent and low-risk, EDUCATE + request approval.

  - id: ISO42001_8_7_PERFORMANCE_MONITORING
    name: "AI Performance Monitoring Active"
    description: "Production AI must have continuous monitoring (Clause 8.7)"
    action: ESCALATE
    priority: 85
    severity: HIGH
    validators: ["model_drift_validator"]
    condition: |
      ai_system.monitoring_enabled == false or
      (model.drift_detected == true and
       days_since(model.last_evaluation) > 30)
    parameters:
      monitoring_frequency_days: 30
    legal_basis: "ISO/IEC 42001:2023 Clause 8.7"
    contestable: false
    mercy_eligible: true
    uncertainty_threshold: 0.7
    rationale: |
      Drift = silent degradation. Mercy: If just implemented, EDUCATE on best practices.

  # ═══════════════════════════════════════════════════════════════
  # CLAUSE 9: PERFORMANCE EVALUATION
  # ═══════════════════════════════════════════════════════════════

  - id: ISO42001_9_1_MONITORING_MEASUREMENT
    name: "AI Performance Metrics"
    description: "Define and track AI performance metrics (Clause 9.1)"
    action: LOG
    priority: 75
    severity: MEDIUM
    validators: ["metrics_validator"]
    condition: |
      ai_system.metrics_defined == false or
      ai_system.metrics_tracked == false
    legal_basis: "ISO/IEC 42001:2023 Clause 9.1"
    contestable: false
    mercy_eligible: false

  - id: ISO42001_9_2_INTERNAL_AUDIT
    name: "AI System Internal Audit"
    description: "Conduct periodic internal audits (Clause 9.2)"
    action: ESCALATE
    priority: 80
    severity: MEDIUM
    validators: ["audit_validator"]
    condition: |
      ai_system.last_internal_audit == null or
      days_since(ai_system.last_internal_audit) > 180
    parameters:
      audit_frequency_days: 180
    legal_basis: "ISO/IEC 42001:2023 Clause 9.2"
    contestable: false
    mercy_eligible: true
    uncertainty_threshold: 0.6

  - id: ISO42001_9_3_MANAGEMENT_REVIEW
    name: "Management Review of AI System"
    description: "Top management reviews AI system periodically (Clause 9.3)"
    action: ESCALATE
    priority: 75
    severity: MEDIUM
    validators: []
    condition: |
      ai_system.last_management_review == null or
      days_since(ai_system.last_management_review) > 365
    legal_basis: "ISO/IEC 42001:2023 Clause 9.3"
    contestable: false
    mercy_eligible: false

  # ═══════════════════════════════════════════════════════════════
  # CLAUSE 10: IMPROVEMENT
  # ═══════════════════════════════════════════════════════════════

  - id: ISO42001_10_1_NONCONFORMITY_CORRECTIVE_ACTION
    name: "AI Nonconformity & Corrective Action"
    description: "Address AI system nonconformities within 30 days (Clause 10.1)"
    action: ESCALATE
    priority: 90
    severity: HIGH
    validators: ["nonconformity_validator"]
    condition: |
      nonconformity.detected == true and
      corrective_action.implemented == false and
      days_since(nonconformity.detection) > 30
    legal_basis: "ISO/IEC 42001:2023 Clause 10.1"
    contestable: false
    mercy_eligible: false

  - id: ISO42001_10_2_CONTINUAL_IMPROVEMENT
    name: "Continual Improvement of AI System"
    description: "Demonstrate continual improvement (Clause 10.2)"
    action: LOG
    priority: 70
    severity: MEDIUM
    validators: []
    condition: |
      improvement_actions.implemented_last_year == 0
    legal_basis: "ISO/IEC 42001:2023 Clause 10.2"
    contestable: false
    mercy_eligible: false

  # ═══════════════════════════════════════════════════════════════
  # ANNEX A: AI-SPECIFIC CONTROLS [GAP CLOSED]
  # ═══════════════════════════════════════════════════════════════

  - id: ISO42001_A611_POLICY_ENFORCEMENT
    name: "Runtime AI Policy Enforcement"
    description: "All production AI must have active policy enforcement (A.6.1.1)"
    action: BLOCK
    priority: 95
    severity: CRITICAL
    validators: ["policy_enforcement_validator"]
    condition: |
      agent.policy_enforcement_enabled == false and
      agent.in_production == true
    legal_basis: "ISO/IEC 42001:2023 Annex A.6.1.1"
    contestable: false
    mercy_eligible: false
    rationale: |
      BuildToValue kernel IS the policy enforcement layer.
      No production deployment without active enforcement.

  - id: ISO42001_A623_EXPLAINABILITY
    name: "Explainability for High-Stakes Decisions"
    description: "High-stakes AI decisions must be explainable (A.6.2.3)"
    action: ESCALATE
    priority: 90
    severity: HIGH
    validators: ["explainability_validator"]
    condition: |
      agent.decision_type in ['credit', 'hiring', 'healthcare', 'legal'] and
      agent.explainability_score < min_score
    parameters:
      min_score: 0.7
    legal_basis: "ISO/IEC 42001:2023 Annex A.6.2.3"
    contestable: true
    mercy_eligible: true
    uncertainty_threshold: 0.7
    rationale: |
      Levinas (Care): Affected individuals deserve explanations.
      Maps to BuildToValue explain_decision() mandate.

  - id: ISO42001_A631_FAIRNESS
    name: "Fairness Metrics Baseline"
    description: "Fairness threshold for AI affecting protected groups (A.6.3.1)"
    action: BLOCK
    priority: 95
    severity: CRITICAL
    validators: ["fairness_validator"]
    condition: |
      agent.fairness_metrics.demographic_parity < min_parity and
      agent.affects_protected_groups == true
    parameters:
      min_parity: 0.8
    legal_basis: "ISO/IEC 42001:2023 Annex A.6.3.1"
    contestable: true
    mercy_eligible: false
    rationale: |
      Rawls (Justice): Demographic parity < 0.8 = unacceptable disparity.
      Contestable: some domains may justify different thresholds.

ethical_notes: |
  ISO 42001 v2.0 gap-closed profile (27 rules):
  RAWLS: A.6.3.1 Fairness, Clause 8.1 Data governance
  LEVINAS: Clause 7.4/8.2 Transparency, A.6.2.3 Explainability
  GILLIGAN: Clause 6.1 Risk context, Clause 8.1 Data quality care
  JONAS: Clause 5.3 Roles, Clause 7.5 Documentation, A.6.1.1 Enforcement

