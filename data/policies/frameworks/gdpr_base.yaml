# BuildToValue v2.0 - GDPR Base Compliance Profile
# General Data Protection Regulation (EU) - Regulation 2016/679
#
# Filosofia Ética Integrada:
# - Rawls (Justiça): Processamento justo independente de quem é o titular
# - Levinas (Cuidado): Right to be forgotten (Art. 17) + Right to object (Art. 21)
# - Gilligan (Misericórdia): DPIA (Art. 35) com contexto de risco
# - Jonas (Responsabilidade): Accountability (Art. 5.2) + Breach notification (Art. 33)
#
# Status: Production-ready
# Version: 1.0.0
# Last Updated: 2026-02-05

id: gdpr_base
name: GDPR Base Compliance Profile
description: |
  General Data Protection Regulation (EU) - Regulation (EU) 2016/679.
  Covers: Lawfulness (Art. 6), Data Minimization (Art. 5), Rights (Art. 15-22),
  Breach Notification (Art. 33-34), International Transfers (Art. 44-50), DPIA (Art. 35).

parent_id: null
version: 1.0.0
legal_framework: GDPR
jurisdiction: EU
created_at: 2026-02-05
updated_at: 2026-02-05

# ═══════════════════════════════════════════════════════════════════════════
# METADATA LEGAL
# ═══════════════════════════════════════════════════════════════════════════

legal_metadata:
  law_name: "General Data Protection Regulation"
  law_number: "Regulation (EU) 2016/679"
  law_url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj"
  enforcement_authority: "EDPB (European Data Protection Board) + National DPAs"
  authority_url: "https://edpb.europa.eu/"
  effective_date: "2018-05-25"

  penalties:
    - type: "Administrative Fine (Tier 1)"
      value: "Up to €10 million or 2% of global turnover"
      applies_to: "Art. 8, 11, 25-39, 42-43"
    - type: "Administrative Fine (Tier 2)"
      value: "Up to €20 million or 4% of global turnover"
      applies_to: "Art. 5-6 (principles), 7-9 (consent), 12-22 (rights), 44-49 (transfers)"

  definitions:
    personal_data: "Any information relating to an identified or identifiable natural person"
    special_categories: "Racial/ethnic origin, political opinions, religious beliefs, trade union membership, genetic/biometric data, health data, sex life/orientation"
    data_controller: "Natural/legal person who determines purposes and means of processing"
    data_processor: "Natural/legal person who processes on behalf of controller"
    dpo: "Data Protection Officer (mandatory for public authorities, large-scale monitoring, special categories)"

domain_config:
  general:
    risk_multiplier: 1.5  # GDPR penalties são mais altas que LGPD
    require_dpo: true
    breach_notification_hours: 72
    data_subject_request_days: 30  # GDPR = 1 mês (LGPD = 15 dias)

  adequate_countries:
    - "AR"  # Argentina
    - "CA"  # Canada (commercial orgs)
    - "CH"  # Switzerland
    - "GB"  # UK (post-Brexit adequacy)
    - "IL"  # Israel
    - "JP"  # Japan
    - "KR"  # South Korea
    - "NZ"  # New Zealand
    - "UY"  # Uruguay
    # Full list: https://ec.europa.eu/info/law/law-topic/data-protection/international-dimension-data-protection/adequacy-decisions_en

# ═══════════════════════════════════════════════════════════════════════════
# RULES - CHAPTER II: PRINCIPLES (Art. 5)
# ═══════════════════════════════════════════════════════════════════════════

rules:
  # ───────────────────────────────────────────────────────────────────────
  # LAWFULNESS, FAIRNESS, TRANSPARENCY (Art. 5.1.a)
  # ───────────────────────────────────────────────────────────────────────
  - id: GDPR_ART5_1A_LAWFULNESS
    name: "Lawfulness, Fairness and Transparency"
    description: "Processing must be lawful, fair and transparent (Art. 5.1.a)"
    action: ESCALATE
    priority: 90
    severity: HIGH

    validators: ["consent_validator", "purpose_validator"]

    condition: |
      data.contains_personal_data == true and
      (processing.legal_basis == null or processing.transparency_provided == false)

    legal_basis: "GDPR Regulation (EU) 2016/679 Art. 5.1.a"
    legal_url: "https://gdpr-info.eu/art-5-gdpr/"

    contestable: true
    mercy_eligible: true
    uncertainty_threshold: 0.7

    rationale: |
      Rawls (Justice as Fairness): Transparent processing is prerequisite for fairness.
      Mercy: If transparency was attempted but unclear, EDUCATE rather than punish.

  # ───────────────────────────────────────────────────────────────────────
  # PURPOSE LIMITATION (Art. 5.1.b)
  # ───────────────────────────────────────────────────────────────────────
  - id: GDPR_ART5_1B_PURPOSE_LIMITATION
    name: "Purpose Limitation"
    description: "Data collected for specified, explicit, legitimate purposes (Art. 5.1.b)"
    action: ESCALATE
    priority: 85
    severity: HIGH

    validators: ["purpose_validator"]

    condition: |
      processing.purpose_changed == true and
      processing.compatible_purpose_assessment == false

    legal_basis: "GDPR Art. 5.1.b"

    contestable: true
    mercy_eligible: true
    uncertainty_threshold: 0.75

    rationale: |
      Purpose compatibility requires case-by-case assessment (Recital 50).
      High uncertainty → EDUCATE DPO to conduct compatibility test.

  # ───────────────────────────────────────────────────────────────────────
  # DATA MINIMIZATION (Art. 5.1.c)
  # ───────────────────────────────────────────────────────────────────────
  - id: GDPR_ART5_1C_DATA_MINIMIZATION
    name: "Data Minimization"
    description: "Adequate, relevant, limited to what is necessary (Art. 5.1.c)"
    action: MONITOR
    priority: 70
    severity: MEDIUM

    validators: ["data_minimization_validator"]

    condition: |
      data.field_count > minimization_threshold

    parameters:
      minimization_threshold: 12  # GDPR mais leniente que LGPD (10)

    legal_basis: "GDPR Art. 5.1.c"

    contestable: true
    mercy_eligible: true
    uncertainty_threshold: 0.6

  # ───────────────────────────────────────────────────────────────────────
  # STORAGE LIMITATION (Art. 5.1.e)
  # ───────────────────────────────────────────────────────────────────────
  - id: GDPR_ART5_1E_STORAGE_LIMITATION
    name: "Storage Limitation"
    description: "Data kept no longer than necessary (Art. 5.1.e)"
    action: LOG
    priority: 60
    severity: MEDIUM

    validators: ["retention_validator"]

    condition: |
      data.purpose_fulfilled == true and
      data.retention_days > retention_limit

    parameters:
      retention_limit: 90  # Default 90 days post-purpose

    legal_basis: "GDPR Art. 5.1.e"

    contestable: false
    mercy_eligible: false

  # ═══════════════════════════════════════════════════════════════════════
  # RULES - CHAPTER III: RIGHTS OF DATA SUBJECT (Art. 12-22)
  # ═══════════════════════════════════════════════════════════════════════

  # ───────────────────────────────────────────────────────────────────────
  # RIGHT OF ACCESS (Art. 15)
  # ───────────────────────────────────────────────────────────────────────
  - id: GDPR_ART15_ACCESS
    name: "Right of Access by Data Subject"
    description: "Data subject has right to access personal data (response in 1 month)"
    action: ESCALATE
    priority: 85
    severity: HIGH

    validators: ["data_access_request_validator"]

    condition: |
      request.type == "data_access" and
      days_since(request.date) > 28

    parameters:
      sla_days: 30  # 1 month = 30 days (GDPR) vs 15 days (LGPD)

    legal_basis: "GDPR Art. 15"

    contestable: false
    mercy_eligible: true
    uncertainty_threshold: 0.8

    rationale: |
      Alert at Day 28 (buffer 2 days).
      Mercy: Complex requests can extend to 3 months (Art. 12.3).

  # ───────────────────────────────────────────────────────────────────────
  # RIGHT TO RECTIFICATION (Art. 16)
  # ───────────────────────────────────────────────────────────────────────
  - id: GDPR_ART16_RECTIFICATION
    name: "Right to Rectification"
    description: "Data subject can request correction of inaccurate data"
    action: MONITOR
    priority: 70
    severity: MEDIUM

    validators: ["data_rectification_validator"]

    condition: |
      request.type == "data_correction"

    legal_basis: "GDPR Art. 16"

    contestable: false
    mercy_eligible: false

  # ───────────────────────────────────────────────────────────────────────
  # RIGHT TO ERASURE (Art. 17 - "Right to be Forgotten")
  # ───────────────────────────────────────────────────────────────────────
  - id: GDPR_ART17_ERASURE
    name: "Right to Erasure (Right to be Forgotten)"
    description: "Data subject can request erasure if grounds apply (Art. 17)"
    action: ESCALATE
    priority: 90
    severity: HIGH

    validators: ["data_erasure_validator"]

    condition: |
      request.type == "data_deletion" and
      processing.has_legal_obligation == false and
      days_since(request.date) > 28

    legal_basis: "GDPR Art. 17"

    contestable: true
    mercy_eligible: true
    uncertainty_threshold: 0.75

    rationale: |
      Levinas (Care for Other): Right to be forgotten = right to restart.
      Mercy: If exceptions (Art. 17.3) are uncertain, EDUCATE DPO.

  # ───────────────────────────────────────────────────────────────────────
  # RIGHT TO DATA PORTABILITY (Art. 20)
  # ───────────────────────────────────────────────────────────────────────
  - id: GDPR_ART20_PORTABILITY
    name: "Right to Data Portability"
    description: "Data subject can receive data in structured, machine-readable format"
    action: LOG
    priority: 65
    severity: MEDIUM

    validators: ["data_portability_validator"]

    condition: |
      request.type == "data_portability"

    legal_basis: "GDPR Art. 20"

    contestable: false
    mercy_eligible: false

  # ───────────────────────────────────────────────────────────────────────
  # RIGHT TO OBJECT (Art. 21)
  # ───────────────────────────────────────────────────────────────────────
  - id: GDPR_ART21_OBJECT
    name: "Right to Object"
    description: "Data subject can object to processing (esp. direct marketing)"
    action: BLOCK
    priority: 95
    severity: CRITICAL

    validators: ["objection_validator"]

    condition: |
      user.has_objected == true and
      processing.continues == true and
      processing.type in ["direct_marketing", "profiling"]

    legal_basis: "GDPR Art. 21"

    contestable: false
    mercy_eligible: false

    rationale: |
      Art. 21.3: Objection to direct marketing = ABSOLUTE RIGHT (no exceptions).
      Jonas (Responsibility): Marketing must stop IMMEDIATELY.

  # ───────────────────────────────────────────────────────────────────────
  # AUTOMATED DECISION-MAKING (Art. 22)
  # ───────────────────────────────────────────────────────────────────────
  - id: GDPR_ART22_AUTOMATED_DECISIONS
    name: "Automated Individual Decision-Making (incl. Profiling)"
    description: "Right not to be subject to purely automated decisions with legal/significant effects"
    action: ESCALATE
    priority: 95
    severity: HIGH

    validators: ["automated_decision_validator"]

    condition: |
      decision.is_automated == true and
      decision.has_legal_effects == true and
      decision.has_human_review == false

    legal_basis: "GDPR Art. 22"

    contestable: true
    mercy_eligible: false

    rationale: |
      Gilligan (Care): Automated decisions lack context = must have human oversight.
      Exceptions (Art. 22.2): Explicit consent, contract necessity, or law.

  # ═══════════════════════════════════════════════════════════════════════
  # RULES - CHAPTER IV: CONTROLLER & PROCESSOR (Art. 24-43)
  # ═══════════════════════════════════════════════════════════════════════

  # ───────────────────────────────────────────────────────────────────────
  # SECURITY OF PROCESSING (Art. 32)
  # ───────────────────────────────────────────────────────────────────────
  - id: GDPR_ART32_SECURITY
    name: "Security of Processing"
    description: "Appropriate technical and organizational measures (Art. 32)"
    action: BLOCK
    priority: 100
    severity: CRITICAL

    validators: ["encryption_validator", "security_controls_validator"]

    condition: |
      (data.contains_personal_data == true and transmission.encrypted == false) or
      (data.at_rest == true and storage.encrypted == false) or
      (agent.security_level < min_security_level)

    parameters:
      min_security_level: 4  # GDPR exige alto nível (scale 1-5)

    legal_basis: "GDPR Art. 32"

    contestable: false
    mercy_eligible: false

    rationale: |
      Jonas (Responsibility): Security is duty, not option.
      Encryption = minimum baseline (Recital 83).

  # ───────────────────────────────────────────────────────────────────────
  # BREACH NOTIFICATION TO AUTHORITY (Art. 33)
  # ───────────────────────────────────────────────────────────────────────
  - id: GDPR_ART33_BREACH_NOTIFICATION_AUTHORITY
    name: "Notification of Personal Data Breach to Authority"
    description: "Notify supervisory authority within 72h (Art. 33)"
    action: ESCALATE
    priority: 100
    severity: CRITICAL

    validators: ["breach_notification_validator"]

    condition: |
      incident.severity in ["high", "critical"] and
      incident.affects_personal_data == true and
      hours_since(incident.detection) > 60

    parameters:
      notification_deadline_hours: 72

    legal_basis: "GDPR Art. 33"

    contestable: false
    mercy_eligible: false

    rationale: |
      Alert at 60h (buffer 12h for preparation).
      Recital 85: "Without undue delay" = 72h max.

  # ───────────────────────────────────────────────────────────────────────
  # BREACH NOTIFICATION TO DATA SUBJECT (Art. 34)
  # ───────────────────────────────────────────────────────────────────────
  - id: GDPR_ART34_BREACH_NOTIFICATION_SUBJECT
    name: "Communication of Personal Data Breach to Data Subject"
    description: "Notify data subject if high risk (Art. 34)"
    action: ESCALATE
    priority: 95
    severity: HIGH

    validators: ["breach_notification_validator"]

    condition: |
      incident.severity == "critical" and
      incident.risk_to_rights == "high" and
      incident.data_subject_notified == false

    legal_basis: "GDPR Art. 34"

    contestable: false
    mercy_eligible: false

    rationale: |
      Levinas (Duty to Other): High risk = must inform affected individuals.
      Exceptions (Art. 34.3): Encrypted data, public awareness, disproportionate effort.

  # ───────────────────────────────────────────────────────────────────────
  # DPIA - DATA PROTECTION IMPACT ASSESSMENT (Art. 35)
  # ───────────────────────────────────────────────────────────────────────
  - id: GDPR_ART35_DPIA
    name: "Data Protection Impact Assessment (DPIA)"
    description: "DPIA required for high-risk processing (Art. 35)"
    action: ESCALATE
    priority: 90
    severity: HIGH

    validators: ["dpia_validator"]

    condition: |
      processing.is_high_risk == true and
      processing.dpia_completed == false and
      processing.type in ["automated_decision", "large_scale_monitoring", "special_categories"]

    legal_basis: "GDPR Art. 35"

    contestable: true
    mercy_eligible: true
    uncertainty_threshold: 0.7

    rationale: |
      Gilligan (Care): DPIA = contextual risk assessment (not blind rules).
      Mercy: If DPIA in progress, EDUCATE + deadline extension.

  # ═══════════════════════════════════════════════════════════════════════
  # RULES - CHAPTER V: INTERNATIONAL TRANSFERS (Art. 44-50)
  # ═══════════════════════════════════════════════════════════════════════

  # ───────────────────────────────────────────────────────────────────────
  # ADEQUACY DECISION (Art. 45)
  # ───────────────────────────────────────────────────────────────────────
  - id: GDPR_ART45_ADEQUACY
    name: "Transfers Based on Adequacy Decision"
    description: "Transfer only to countries with adequacy decision (Art. 45)"
    action: BLOCK
    priority: 100
    severity: CRITICAL

    validators: ["international_transfer_validator"]

    condition: |
      transfer.destination_country not in adequate_countries and
      transfer.has_sccs == false and
      transfer.has_bcr == false

    parameters:
      adequate_countries: ${domain_config.adequate_countries}

    legal_basis: "GDPR Art. 45"

    contestable: true
    mercy_eligible: false

    rationale: |
      Post-Schrems II: US lost adequacy (2020).
      Alternatives: SCCs (Art. 46), BCRs (Art. 47), derogations (Art. 49).

  # ───────────────────────────────────────────────────────────────────────
  # STANDARD CONTRACTUAL CLAUSES (Art. 46)
  # ───────────────────────────────────────────────────────────────────────
  - id: GDPR_ART46_SCCS
    name: "Standard Contractual Clauses (SCCs)"
    description: "SCCs required if no adequacy decision (Art. 46)"
    action: ESCALATE
    priority: 90
    severity: HIGH

    validators: ["sccs_validator"]

    condition: |
      transfer.destination_country not in adequate_countries and
      transfer.has_sccs == false

    legal_basis: "GDPR Art. 46"

    contestable: true
    mercy_eligible: true
    uncertainty_threshold: 0.65

    rationale: |
      Mercy: If SCCs in signature process, EDUCATE + 21-day grace period.

# ═══════════════════════════════════════════════════════════════════════════
# ETHICAL INTEGRATION NOTES
# ═══════════════════════════════════════════════════════════════════════════

ethical_notes: |
  GDPR compliance + ethical governance integration:
  
  RAWLS (Justice as Fairness):
  - Art. 22 (Automated Decisions): No blind algorithms without human review
  - Art. 5.1.a (Transparency): Fairness requires data subjects know what happens
  
  LEVINAS (Duty of Care):
  - Art. 17 (Right to be Forgotten): Care = allowing people to restart
  - Art. 34 (Breach Notification): High risk = duty to inform immediately
  
  GILLIGAN (Ethics of Care):
  - Art. 35 (DPIA): Context-based risk assessment (not one-size-fits-all)
  - Art. 21 (Objection): Respect individual circumstances (esp. vulnerable groups)
  
  JONAS (Responsibility Principle):
  - Art. 32 (Security): Technical safeguards = accountability
  - Art. 33 (Breach Notification): 72h = urgency proportional to risk

