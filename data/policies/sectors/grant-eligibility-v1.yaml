# BuildToValue — Grant Eligibility Policy v1
# Sector: grants / quadratic-funding / DAO-treasury
# Path: data/policies/sectors/grant-eligibility-v1.yaml
#
# This policy governs the ethical pipeline for grant proposal evaluation.
# It integrates with the BTV Rust kernel (Executive branch) and the
# Python Governance layer (Judicial branch).
#
# Philosophical foundations:
#   Rawls  — equitable distribution of access regardless of applicant origin
#   Levinas — every blocked applicant deserves to know why and how to appeal
#   Jonas  — responsibility: do not fabricate bias data for uncalibrated groups
#   Gilligan — mercy: use EDUCATE before BLOCK for first-time borderline cases
#
# ADR reference: docs/adr/0043-unified-verdict-identity.md

schema_version: "2"
policy_id: "grant-eligibility-v1"
description: "Grant proposal eligibility evaluation — multi-jurisdiction, multilingual"
sector: "grants"
effective_date: "2026-04-11"

# ---------------------------------------------------------------------------
# Risk Thresholds
# ---------------------------------------------------------------------------
risk_thresholds:
  low:       { max: 0.30 }
  moderate:  { min: 0.30, max: 0.55 }
  elevated:  { min: 0.55, max: 0.70 }
  high:      { min: 0.70, max: 0.85 }
  critical:  { min: 0.85 }

# ---------------------------------------------------------------------------
# Decision Mapping
# ---------------------------------------------------------------------------
decision_matrix:
  - risk_level: low
    action: ALLOW
    contestable: false
    appeal_deadline_hours: 0

  - risk_level: moderate
    action: EDUCATE
    contestable: false
    appeal_deadline_hours: 0
    notes: "Gilligan mercy — provide guidance before blocking"

  - risk_level: elevated
    action: INSPECT
    contestable: true
    appeal_deadline_hours: 168  # 7 days

  - risk_level: high
    action: BLOCK
    contestable: true
    appeal_deadline_hours: 168  # 7 days (Levinas SLA)
    notes: "Policy block — applicant may file appeal within 7 days"

  - risk_level: critical
    action: BLOCK
    hard_block: true
    contestable: false
    appeal_deadline_hours: 0
    notes: "Hard block — sanctioned entity, known scam, or OFAC match"

# ---------------------------------------------------------------------------
# Hard Block Triggers (Rust kernel fast-path)
# ---------------------------------------------------------------------------
hard_block_triggers:
  sanctioned_countries:
    - KP  # North Korea
    - IR  # Iran
    - SY  # Syria
    - CU  # Cuba
    description: "OFAC-sanctioned jurisdictions — financial transactions prohibited"

  scam_patterns:
    - pattern: "guaranteed.*\\d+x"
      description: "Guaranteed multiplier returns"
    - pattern: "(guaranteed|garantido|garantizado).*\\d+%.*\\d+\\s*(days?|dias?|días?)"
      description: "Guaranteed percentage return in X days (multilingual)"
    - pattern: "(pyramid|piramidal|pirâmide|esquema ponzi)"
      description: "Pyramid/Ponzi scheme language"
    - pattern: "(recruit|recrutar|reclutar).*friends.*earn"
      description: "Multi-level recruitment schemes"
    - pattern: "guaranteed.*passive.*income"
      description: "Guaranteed passive income"

  deny_list_wallets:
    description: "Known scam wallet addresses — updated from chainanalysis feed"
    source: "data/deny-lists/wallets.json"

# ---------------------------------------------------------------------------
# Category-Specific Overrides
# ---------------------------------------------------------------------------
category_overrides:
  defi:
    risk_adjustment: +0.10
    notes: "DeFi proposals carry additional financial risk — risk score bumped +10%"
    require_fields:
      - audit_status
      - smart_contract_address

  governance:
    risk_adjustment: +0.05
    notes: "Governance proposals affecting protocol parameters — elevated scrutiny"

  public_goods:
    risk_adjustment: -0.05
    notes: "Public goods with open-source commitment — risk score reduced -5%"
    require_fields:
      - open_source_license

# ---------------------------------------------------------------------------
# BiasDeclaration Requirements (Jonas integrity principle)
# ---------------------------------------------------------------------------
bias_declarations:
  en-US:
    status: calibrated
    fpr: 0.03
    fnr: 0.05
    sample_size: 2400
    last_calibrated: "2025-11-01"
    notes: "Calibrated against Gitcoin Grants Round 18"

  pt-BR:
    status: calibrated
    fpr: 0.07
    fnr: 0.09
    sample_size: 800
    last_calibrated: "2025-11-01"
    notes: "Calibrated against Web3 Comunidade proposals"

  es:
    status: calibrated
    fpr: 0.06
    fnr: 0.08
    sample_size: 600
    last_calibrated: "2025-11-01"
    notes: "Calibrated against Spanish-speaking DAO proposals"

  sw:
    status: uncalibrated
    fpr: null  # DO NOT fabricate — Jonas principle
    fnr: null  # DO NOT fabricate — Jonas principle
    sample_size: 0
    last_calibrated: null
    notes: |
      UNCALIBRATED — no real Swahili grant proposals available yet.
      FPR/FNR MUST remain null. Never fabricate calibration data.
      Target: 500+ proposals from East African Web3 community
      (Kenya, Tanzania, Uganda, Rwanda).
      Default action for sw proposals: INSPECT (elevated scrutiny)
      until calibration data is available.
    default_action_override: INSPECT

# ---------------------------------------------------------------------------
# Contestability SLA (Levinas principle)
# ---------------------------------------------------------------------------
contestability:
  sla_hours: 168  # 7 days
  appeals_endpoint: "/v1/appeals"
  response_sla_hours: 24  # BTV commits to 24h response
  hard_block_contestable: false  # Hard blocks bypass appeal pathway
  notification_channels:
    - email
    - webhook

# ---------------------------------------------------------------------------
# Transparency Requirements (Radical Transparency)
# ---------------------------------------------------------------------------
transparency:
  explain_decision: true      # explain_decision() mandatory for all actions
  bias_declaration: true      # BiasDeclaration must be attached to every verdict
  audit_log: true             # All decisions logged to immutable ledger
  rationale_languages:        # Rationale must be provided in applicant's language
    - en-US
    - pt-BR
    - es
    - sw
