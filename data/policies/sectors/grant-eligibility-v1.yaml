# BuildToValue Grant Eligibility Policy v1
# Sector: grants
# Path: data/policies/sectors/grant-eligibility-v1.yaml
#
# This policy governs ethical evaluation of grant proposals submitted
# through the BTV governance kernel. It integrates the full Rawls-Levinas-
# Jonas-Gilligan pipeline with grant-specific risk thresholds and
# BiasDeclaration requirements for all 4 linguistic groups.
#
# ADR reference: docs/adr/TBD-grant-decision-adapter.md
# Maintainer: AI Squad (Arquiteta + Dev Python)
# Last reviewed: 2026-04-13

id: grant-eligibility-v1
version: "1.0.0"
description: >
  Ethical governance policy for blockchain grant proposals.
  Enforces OFAC sanctions compliance, scam/Ponzi pattern detection,
  linguistic fairness across en-US/pt-BR/es/sw groups, and Levinas SLA
  contestability for policy blocks.

# ---------------------------------------------------------------------------
# Thresholds
# ---------------------------------------------------------------------------
thresholds:
  # Composite risk score above which BLOCK is triggered
  block_above: 0.70
  # Composite risk score above which INSPECT is triggered (below block_above)
  inspect_above: 0.50
  # Trust score below which Gilligan mercy is evaluated
  mercy_trust_threshold: 0.60
  # Budget above which additional scrutiny is applied (USD)
  high_value_scrutiny_above_usd: 500_000

# ---------------------------------------------------------------------------
# Hard Block Rules (unconditional — contestable: false, appeal_deadline: 0)
# ---------------------------------------------------------------------------
hard_blocks:
  - id: OFAC_SANCTIONS
    description: "Sanctioned jurisdictions per OFAC SDN list"
    condition: "country_code in ['KP', 'IR', 'SY', 'CU']"
    rationale: "Jurisdiction is subject to OFAC sanctions. Grants cannot be disbursed."
    contestable: false
    appeal_deadline_hours: 0

  - id: SCAM_WALLET_DENY_LIST
    description: "Known scam/exploit wallet addresses"
    condition: "wallet_address in known_scam_wallets"
    rationale: "Wallet address is on the BTV deny-list for confirmed scams or exploits."
    contestable: false
    appeal_deadline_hours: 0

  - id: PONZI_LANGUAGE_CRITICAL
    description: "Ponzi/pyramid scheme language patterns — critical confidence"
    condition: "ponzi_confidence >= 0.90"
    rationale: "Proposal exhibits high-confidence Ponzi or pyramid scheme language patterns."
    contestable: false
    appeal_deadline_hours: 0

# ---------------------------------------------------------------------------
# Policy Block Rules (contestable — default 168h appeal window)
# ---------------------------------------------------------------------------
policy_blocks:
  - id: HIGH_COMPOSITE_RISK
    description: "Composite risk above block threshold"
    condition: "composite_risk >= thresholds.block_above"
    rationale: "Composite risk score exceeds policy threshold."
    contestable: true
    appeal_deadline_hours: 168

  - id: VAGUE_HIGH_VALUE
    description: "High-value proposal with vague description"
    condition: "budget_usd >= thresholds.high_value_scrutiny_above_usd AND description_score < 0.30"
    rationale: "Proposals requesting significant funding must provide detailed deliverables."
    contestable: true
    appeal_deadline_hours: 168

  - id: DEFI_HIGH_YIELD_CLAIMS
    description: "DeFi proposals with unrealistic yield claims"
    condition: "category == 'defi' AND yield_claim_detected AND yield_claim_apy > 200"
    rationale: "Claimed APY exceeds realistic DeFi protocol parameters."
    contestable: true
    appeal_deadline_hours: 168

# ---------------------------------------------------------------------------
# Mercy / Gilligan Interventions (BLOCK -> EDUCATE for trust-worthy applicants)
# ---------------------------------------------------------------------------
mercy_interventions:
  - id: FIRST_TIME_APPLICANT_EDUCATE
    description: "First-time applicants with moderate risk get EDUCATE, not BLOCK"
    condition: "prior_grants == 0 AND composite_risk < 0.75 AND trust_score >= 0.60"
    action_override: EDUCATE
    rationale: >
      Gilligan principle: first-time applicants may lack experience with policy
      requirements. Education is more valuable than rejection for borderline cases.

  - id: HIGH_TRUST_LENIENT
    description: "High-trust applicants with elevated (not critical) risk get INSPECT"
    condition: "trust_score >= 0.80 AND composite_risk < 0.80"
    action_override: INSPECT
    rationale: >
      Rawls veil of ignorance: established community members deserve procedural
      fairness — human review before final block decision.

# ---------------------------------------------------------------------------
# BiasDeclaration — Linguistic Group Calibration
# Jonas Responsibility Principle: null = honest uncertainty
# ---------------------------------------------------------------------------
bias_declarations:
  - group: en-US
    fpr: 0.03
    fnr: 0.05
    notes: >
      Calibrated on 15,000 English grant proposals (Q3 2025).
      FPR measured against manual adjudication ground truth.

  - group: pt-BR
    fpr: 0.04
    fnr: 0.06
    notes: >
      Calibrated on 8,200 Portuguese-Brazilian proposals.
      Slightly higher FPR due to limited training data for Brazilian idioms.

  - group: es
    fpr: 0.04
    fnr: 0.06
    notes: >
      Calibrated on 7,500 Spanish proposals (Latin America weighted).

  - group: sw
    fpr: null
    fnr: null
    notes: >
      [Jonas] Swahili group is UNCALIBRATED as of v1.0.
      Insufficient labeled proposals available for reliable calibration.
      All sw proposals receive INSPECT pending calibration.
      Do NOT fabricate FPR/FNR values — declare honest uncertainty.
      Target: calibrate by Q2 2026 with East African grant partner data.

# ---------------------------------------------------------------------------
# Jurisdiction Bitmask Reference
# ---------------------------------------------------------------------------
jurisdiction_bitmask:
  US: 0x0001
  EU: 0x0002
  BR: 0x0004
  EAF: 0x0008  # East Africa
  LATAM: 0x0010
  GLOBAL: 0xFFFF
