# ==========================================================================
# BuildToValue Governance Policy — Grant Eligibility v1
# ==========================================================================
# Sector: Grant Funding (Quadratic Funding, DAO Treasury, Public Goods)
# Version: 1.0.0
# Created: 2025-11-01
# Expires: 2026-05-01  (90-day expiry — Jonas integrity principle)
# Path:   data/policies/sectors/grant-eligibility-v1.yaml
# ==========================================================================

metadata:
  policy_id: "POL-GRANT-ELIG-001"
  name: "Grant Eligibility Policy"
  version: "1.0.0"
  sector: "grants"
  created: "2025-11-01T00:00:00Z"
  expires: "2026-05-01T00:00:00Z"
  author: "BTV Governance Team"
  description: >
    Governs evaluation of grant proposals for quadratic funding rounds,
    DAO treasury disbursements, and public goods funding. Covers financial
    risk, identity verification, deliverable feasibility, and jurisdictional
    compliance.

jurisdiction:
  bitmask_schema:
    0x01: "OFAC — US Office of Foreign Assets Control"
    0x02: "EU — European Union AML Directives"
    0x04: "UK — UK OFAC Sanctions"
    0x08: "UN — United Nations Security Council"
    0x10: "BR — Brazilian Central Bank (BCB) Crypto Regulations"
    0x20: "SG — Monetary Authority of Singapore"
    0x40: "JP — Japanese Financial Services Agency"
    0x80: "KE — Central Bank of Kenya"

  sanctioned_country_codes:
    - "KP"  # North Korea
    - "IR"  # Iran
    - "SY"  # Syria
    - "CU"  # Cuba
    - "VE"  # Venezuela (partial)

  elevated_risk_country_codes:
    - "RU"  # Russia
    - "BY"  # Belarus
    - "MM"  # Myanmar

financial:
  budget_tiers:
    - tier: "micro"
      max_usd: 1000
      risk_multiplier: 0.8
      description: "Small community grants — reduced scrutiny"

    - tier: "small"
      max_usd: 10000
      risk_multiplier: 1.0
      description: "Standard individual grants — normal scrutiny"

    - tier: "medium"
      max_usd: 100000
      risk_multiplier: 1.3
      description: "Team grants — elevated scrutiny"

    - tier: "large"
      max_usd: 500000
      risk_multiplier: 1.6
      description: "Major grants — high scrutiny, mandatory human review on INSPECT"

    - tier: "mega"
      max_usd: null
      risk_multiplier: 2.0
      description: "Ecosystem grants — maximum scrutiny"

  anomaly_checks:
    budget_per_deliverable_max_usd: 250000
    budget_per_team_member_max_usd: 500000
    budget_description_ratio_min: 0.01
    budget_description_ratio_max: 100.0

thresholds:
  allow:
    max_risk: 0.30
    description: "Low risk — allow with standard logging"

  educate:
    min_risk: 0.30
    max_risk: 0.50
    description: "Moderate risk — allow with educational guidance"

  inspect:
    min_risk: 0.50
    max_risk: 0.70
    description: "Elevated risk — requires human review before disbursement"

  block:
    min_risk: 0.70
    max_risk: 0.90
    description: "High risk — block with contestability (Levinas appeal pathway)"

  hard_block:
    min_risk: 0.90
    description: "Critical risk — hard block, no appeal pathway"

actions:
  ALLOW:
    description: "Proposal passes governance — proceed with funding"
    post_action: "LOG"
    human_review: false

  EDUCATE:
    description: "Proposal passes with conditions — applicant receives guidance"
    post_action: "LOG"
    human_review: false
    educate_message: >
      Your proposal has been approved with educational guidance. Please review
      the attached recommendations for strengthening your project's governance
      practices before fund disbursement.

  INSPECT:
    description: "Proposal requires human review before final decision"
    post_action: "LOG"
    human_review: true
    review_sla_hours: 72
    review_escalation_hours: 168

  BLOCK:
    description: "Proposal blocked — applicant may appeal"
    post_action: "LOG"
    human_review: false
    contestable: true
    appeal_deadline_hours: 168
    appeal_endpoint: "/v1/appeals"

  REDACT:
    description: "Proposal has sensitive content redacted before review"
    post_action: "LOG"
    human_review: true
    contestable: true
    appeal_deadline_hours: 168

  LOG:
    description: "Informational — no governance action required"
    post_action: "LOG"
    human_review: false

rawls:
  fairness_weights:
    community_benefit: 0.30
    accessibility: 0.25
    inclusivity: 0.20
    transparency: 0.15
    accountability: 0.10
  veil_of_ignorance:
    enabled: true
    strip_identity_fields:
      - "applicant_id"
      - "wallet_address"
      - "country_code"
      - "team_size"

levinas:
  sla:
    initial_response_hours: 24
    appeal_response_hours: 72
    escalation_hours: 168
  contestability:
    contestable_actions:
      - "BLOCK"
      - "REDACT"
    non_contestable_actions:
      - "ALLOW"
      - "LOG"
    hard_block_contestable: false
  language:
    supported_groups:
      - "en-US"
      - "pt-BR"
      - "es"
      - "sw"
    fallback_group: "en-US"
    translation_required_for: []

jonas:
  policy_expiry_days: 90
  retention:
    verdict_retention_days: 365
    session_retention_days: 180
    appeal_retention_days: 730
  bias:
    require_declaration: true
    uncalibrated_groups:
      - group: "sw"
        action: "FLAG"
        description: >
          Swahili group is uncalibrated. Proposals in this group will be
          flagged for additional review. FPR/FNR must NOT be fabricated.
          Target: 500+ real proposals for calibration.

gilligan:
  mercy:
    enabled: true
    max_intervention: "EDUCATE"
    trust_threshold: 0.6
    critical_findings_override: false
  care_factors:
    first_time_applicant_bonus: 0.05
    community_endorsement_weight: 0.15
    previous_grants_completed_weight: 0.20
    previous_grants_failed_weight: -0.25

categories:
  public_goods:
    risk_adjustment: -0.05
    max_budget_multiplier: 2.0
    description: "Open-source, free services, commons infrastructure"
  infrastructure:
    risk_adjustment: 0.0
    max_budget_multiplier: 3.0
    description: "Protocol development, tooling, node operations"
  community:
    risk_adjustment: -0.03
    max_budget_multiplier: 1.5
    description: "Events, education, meetup programs, content creation"
  education:
    risk_adjustment: -0.05
    max_budget_multiplier: 1.5
    description: "Educational content, courses, workshops, research grants"
  climate:
    risk_adjustment: -0.02
    max_budget_multiplier: 2.5
    description: "Environmental sustainability, carbon offset, regenerative"
  defi:
    risk_adjustment: 0.10
    max_budget_multiplier: 2.0
    description: "DeFi protocols, lending, AMMs, yield strategies"
  governance:
    risk_adjustment: 0.05
    max_budget_multiplier: 2.0
    description: "DAO tooling, voting mechanisms, governance frameworks"
  open_source:
    risk_adjustment: -0.05
    max_budget_multiplier: 2.0
    description: "Open-source software, libraries, frameworks"
  research:
    risk_adjustment: 0.03
    max_budget_multiplier: 3.0
    description: "Academic research, R&D, experimental protocols"
  other:
    risk_adjustment: 0.0
    max_budget_multiplier: 1.5
    description: "Uncategorized proposals — standard risk profile"
