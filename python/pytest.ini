[pytest]
testpaths = tests/unit tests/integration tests/ethical tests/scenarios tests/property tests/security tests/system
addopts = --strict-markers -v -m "not ffi"
markers =
    ethical: Ethical philosophy tests
    e2e: End-to-end (requires Docker)
    ffi: Requires Rust FFI (maturin develop)
    committee: Ethical committee tests
    security: Security tests
    scenario: Scenario simulation tests (5-dimension attack vectors)
    property: Property-based tests (hypothesis)
    system: System-level E2E in-process tests (Passo 15)

