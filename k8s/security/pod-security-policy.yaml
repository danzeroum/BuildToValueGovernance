# ════════════════════════════════════════════════════════════════════════════
# BuildToValue v2.0 - Pod Security Standards
# ════════════════════════════════════════════════════════════════════════════
# ✅ CORRIGIDO: Substituiu PodSecurityPolicy (obsoleta) por Pod Security Admission
# Kubernetes >= 1.25 compatível
# ════════════════════════════════════════════════════════════════════════════

apiVersion: v1
kind: Namespace
metadata:
  name: buildtovalue
  labels:
    # ═══════════════════════════════════════════════════════════════════════
    # Pod Security Standards (PSS) - Kubernetes >= 1.25
    # ═══════════════════════════════════════════════════════════════════════
    # Enforce: Bloqueia pods que violam o padrão 'restricted'
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    
    # Audit: Registra violações em logs de auditoria
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    
    # Warn: Avisa usuário sobre violações (não bloqueia)
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    
    # Metadata adicionais
    name: buildtovalue
    env: production
    tier: critical

---
# ════════════════════════════════════════════════════════════════════════════
# Network Policy (mantido do original)
# ════════════════════════════════════════════════════════════════════════════

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: buildtovalue-network-policy
  namespace: buildtovalue
spec:
  podSelector:
    matchLabels:
      app: buildtovalue
  
  policyTypes:
    - Ingress
    - Egress
  
  # ═══════════════════════════════════════════════════════════════════════
  # Ingress Rules (o que pode conectar AO buildtovalue)
  # ═══════════════════════════════════════════════════════════════════════
  ingress:
    # Allow from Ingress Controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
    
    # Allow Prometheus scraping
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 9090
    
    # Allow from same namespace (pod-to-pod)
    - from:
        - podSelector:
            matchLabels:
              app: buildtovalue
      ports:
        - protocol: TCP
          port: 8000
  
  # ═══════════════════════════════════════════════════════════════════════
  # Egress Rules (o que buildtovalue pode conectar)
  # ═══════════════════════════════════════════════════════════════════════
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: UDP
          port: 53
    
    # Allow PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    
    # Allow Redis
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    
    # Allow HTTPS external (remote sync, APIs, etc)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
    
    # Block everything else (default deny)

---
# ════════════════════════════════════════════════════════════════════════════
# RBAC (mantido do original)
# ════════════════════════════════════════════════════════════════════════════

apiVersion: v1
kind: ServiceAccount
metadata:
  name: buildtovalue-sa
  namespace: buildtovalue

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: buildtovalue-role
  namespace: buildtovalue
rules:
  # Read-only access to ConfigMaps
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  
  # Read-only access to Secrets (only specific ones)
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["buildtovalue-secrets"]
    verbs: ["get"]
  
  # Read-only access to own pods
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  
  # No write access, no exec, no delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: buildtovalue-rolebinding
  namespace: buildtovalue
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: buildtovalue-role
subjects:
  - kind: ServiceAccount
    name: buildtovalue-sa
    namespace: buildtovalue

---
# ════════════════════════════════════════════════════════════════════════════
# ℹ️ INFORMAÇÃO: Pod Security Standards (PSS)
# ════════════════════════════════════════════════════════════════════════════
# 
# O PSS 'restricted' impõe as seguintes restrições:
#
# ✅ Containers devem rodar como
