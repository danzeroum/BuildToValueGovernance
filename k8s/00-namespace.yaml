
apiVersion: v1
kind: Namespace
metadata:
  name: buildtovalue
  labels:
    name: buildtovalue
    env: production

---
# k8s/01-configmap.yaml

apiVersion: v1
kind: ConfigMap
metadata:
  name: buildtovalue-config
  namespace: buildtovalue
data:
  BUILDTOVALUE_ENV: "production"
  RUST_LOG: "info"
  LOG_LEVEL: "INFO"
  ENABLE_SWAGGER: "false"
  
  # Performance
  MAX_BATCH_SIZE: "100"
  BATCH_TIMEOUT_MS: "10"
  
  # Security
  CONSTANT_TIME_VALIDATION: "true"
  JITTER_PERCENT: "0.10"
  
  # Governance
  TRUST_DECAY_HALF_LIFE_HOURS: "720"  # 30 dias
  MERCY_THRESHOLD_LOW: "0.5"
  MERCY_THRESHOLD_HIGH: "0.8"
  
  # Ledger
  WAL_CAPACITY: "10000"
  FLUSH_INTERVAL_SECONDS: "60"
  
  # Observability
  METRICS_PORT: "9090"
  HEALTH_CHECK_INTERVAL_SECONDS: "30"

---
# k8s/02-secret.yaml

apiVersion: v1
kind: Secret
metadata:
  name: buildtovalue-secrets
  namespace: buildtovalue
type: Opaque
stringData:
  DATABASE_URL: "postgresql://btv_prod:SECURE_PASSWORD@postgres-service:5432/buildtovalue"
  REDIS_URL: "redis://redis-service:6379/0"
  SIGNING_KEY: "REPLACE_WITH_ACTUAL_KEY_32_BYTES_LONG_SECURE_KEY"
  SMTP_PASSWORD: "email_password_here"