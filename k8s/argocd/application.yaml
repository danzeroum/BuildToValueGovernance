
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: buildtovalue-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: buildtovalue
  
  # ═══════════════════════════════════════════════════════════════
  # Source (Git Repository)
  # ═══════════════════════════════════════════════════════════════
  source:
    repoURL: https://github.com/buildtovalue/infrastructure
    targetRevision: main
    path: k8s/overlays/production
    
    # Kustomize configuration
    kustomize:
      version: v5.0.0
      commonLabels:
        app.kubernetes.io/name: buildtovalue
        app.kubernetes.io/version: "2.0.0"
        app.kubernetes.io/managed-by: argocd
      
      # Image tag overrides (from CI/CD)
      images:
        - buildtovalue-api=ghcr.io/buildtovalue/api:v2.0.0
        - buildtovalue-kernel=ghcr.io/buildtovalue/kernel:v2.0.0
  
  # ═══════════════════════════════════════════════════════════════
  # Destination (Kubernetes Cluster)
  # ═══════════════════════════════════════════════════════════════
  destination:
    server: https://kubernetes.default.svc
    namespace: buildtovalue-production
  
  # ═══════════════════════════════════════════════════════════════
  # Sync Policy (Automated GitOps)
  # ═══════════════════════════════════════════════════════════════
  syncPolicy:
    automated:
      prune: true      # Delete resources not in Git
      selfHeal: true   # Auto-sync if cluster drifts from Git
      allowEmpty: false
    
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
    
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  # ═══════════════════════════════════════════════════════════════
  # Health Assessment
  # ═══════════════════════════════════════════════════════════════
  health:
    checks:
      - kind: Deployment
        name: buildtovalue-api
        namespace: buildtovalue-production
        healthyThreshold: 2
      
      - kind: StatefulSet
        name: postgres
        namespace: buildtovalue-production
        healthyThreshold: 1
  
  # ═══════════════════════════════════════════════════════════════
  # Ignore Differences (Expected Drift)
  # ═══════════════════════════════════════════════════════════════
  ignoreDifferences:
    # Ignore HPA replica count (dynamic)
    - group: apps
      kind: Deployment
      name: buildtovalue-api
      jsonPointers:
        - /spec/replicas
    
    # Ignore secret data (sealed-secrets manages)
    - group: ""
      kind: Secret
      jqPathExpressions:
        - .data

---
# k8s/argocd/project.yaml

apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: buildtovalue
  namespace: argocd
spec:
  description: BuildToValue Trust OS
  
  # ═══════════════════════════════════════════════════════════════
  # Source Repositories (Git)
  # ═══════════════════════════════════════════════════════════════
  sourceRepos:
    - https://github.com/buildtovalue/infrastructure
    - https://github.com/buildtovalue/governance_v095
  
  # ═══════════════════════════════════════════════════════════════
  # Allowed Destinations
  # ═══════════════════════════════════════════════════════════════
  destinations:
    - namespace: buildtovalue-production
      server: https://kubernetes.default.svc
    
    - namespace: buildtovalue-staging
      server: https://kubernetes.default.svc
  
  # ═══════════════════════════════════════════════════════════════
  # Allowed Resource Types
  # ═══════════════════════════════════════════════════════════════
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  
  namespaceResourceWhitelist:
    - group: ""
      kind: "*"
    
    - group: apps
      kind: "*"
    
    - group: batch
      kind: "*"
    
    - group: networking.k8s.io
      kind: "*"
    
    - group: policy
      kind: "*"
  
  # ═══════════════════════════════════════════════════════════════
  # Roles (RBAC for ArgoCD)
  # ═══════════════════════════════════════════════════════════════
  roles:
    # Developers (read-only)
    - name: developer
      description: Developers can view applications
      policies:
        - p, proj:buildtovalue:developer, applications, get, buildtovalue/*, allow
        - p, proj:buildtovalue:developer, applications, sync, buildtovalue/*, deny
      
      groups:
        - buildtovalue-developers
    
    # SRE (full access)
    - name: sre
      description: SRE can manage applications
      policies:
        - p, proj:buildtovalue:sre, applications, *, buildtovalue/*, allow
      
      groups:
        - buildtovalue-sre