
id: medical-agent
name: Medical AI Agent
description: |
  Perfil para agentes de IA em contexto médico.
  Permite discussão de dados sensíveis (CPF, prontuários) em contexto apropriado.

parent_id: base  # Herda de base profile

version: 2.1.0
created_at: "2026-01-15T10:00:00Z"
updated_at: "2026-02-01T14:30:00Z"
reviewed_by:
  - "ethical-committee@buildtovalue.com"
  - "dpo@buildtovalue.com"

rules:
  # Regra específica: Permite CPF em contexto médico
  - id: ALLOW_CPF_IN_MEDICAL
    description: |
      CPF pode ser discutido em contexto médico (agendamentos, prontuários).
      Requer role 'healthcare_professional' ou 'patient'.
    condition: "finding.title == 'CPF_PATTERN_DETECTED' AND context.domain == 'medical'"
    action: EDUCATE  # Permite mas educa
    priority: 200  # Alta prioridade (sobrescreve base)
    domain: medical
    required_findings:
      - CPF_PATTERN_DETECTED
    min_trust_score: 0.3
  
  # Regra: Bloqueia múltiplos CPFs (mesmo em medical)
  - id: BLOCK_MULTIPLE_CPF_MEDICAL
    description: "Bloqueia se detectar >2 CPFs diferentes (suspeita de vazamento)"
    condition: "len(findings.filter(CPF)) > 2"
    action: BLOCK
    priority: 250  # Mais alta que ALLOW_CPF_IN_MEDICAL
    domain: medical
  
  # Regra: CNPJ sempre permitido em medical (clínicas, hospitais)
  - id: ALLOW_CNPJ_IN_MEDICAL
    description: "CNPJ de instituições de saúde é permitido"
    condition: "finding.title == 'CNPJ_PATTERN_DETECTED' AND context.domain == 'medical'"
    action: LOG
    priority: 180
    domain: medical

domain_config:
  medical:
    risk_multiplier: 0.7  # Reduz risco em 30% (contexto privilegiado)
    allowed_findings:
      - CPF_PATTERN_DETECTED
      - CNPJ_PATTERN_DETECTED
      - PHONE_PATTERN_DETECTED
    blocked_findings:
      - CREDIT_CARD_DETECTED  # Cartão nunca é legítimo em medical
    education_message: |
      ⚕️ Você está em contexto médico. Dados pessoais podem ser discutidos 
      para fins de atendimento. Certifique-se de que o paciente autorizou 
      o compartilhamento (LGPD Art. 7º, I).
  
  research:
    risk_multiplier: 0.5  # Contexto muito privilegiado
    allowed_findings:
      - CPF_PATTERN_DETECTED  # Para dados anonimizados
    education_message: |
      🔬 Você está em contexto de pesquisa. Certifique-se de que dados 
      estão anonimizados (LGPD Art. 13).