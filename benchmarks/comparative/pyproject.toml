[project]
name = "btv-benchmark"
version = "1.0.0"
description = "Public benchmark harness for comparing guardrail systems"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "rich>=13.8",
]

[project.optional-dependencies]
all = [
    "boto3>=1.35",          # AWS Bedrock
    "nemoguardrails>=0.10", # NeMo Guardrails
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["adapters*", "src*"]
