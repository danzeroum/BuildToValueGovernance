id: SC-003
name: cross_domain_trust_compatible
category: compatible
description: >
  Agent A (finance domain) and Agent B (HR domain) establishing cross-domain
  access. Both require MFA; Agent B additionally requires role-based access.
  Additive security requirements — should converge in ≤3 rounds.

agent_a_policy:
