[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "btv-mcp-server"
version = "0.1.0"
description = "MCP Server exposing BuildToValue governance as AI agent tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
keywords = ["mcp", "ai", "governance", "ethics", "tools"]
dependencies = [
    "mcp>=1.0",
    "buildtovalue>=0.1",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.scripts]
btv-mcp = "btv_mcp.server:run"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
