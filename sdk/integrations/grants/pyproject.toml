[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "btv-grants"
version = "0.1.0-alpha"
description = "BuildToValue Grant Decision Adapter — BTV governance for grant proposal evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "BTV Governance Team" },
]
keywords = ["buildtovalue", "governance", "grants", "gitcoin", "quadratic-funding", "dao"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "buildtovalue-sdk>=0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
  "mypy>=1.5",
  "ruff>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["btv_grants"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
