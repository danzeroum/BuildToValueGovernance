# BuildToValue — local pre-commit hooks (PR-3)
#
# Install:
#   pip install pre-commit
#   pre-commit install
#
# Run manually against the whole tree:
#   pre-commit run --all-files
#
# The hooks below are deliberately cheap; CI runs the same guards plus
# coverage, license, and SLSA checks.

repos:
  - repo: local
    hooks:
      - id: btv-lint-guards
        name: BTV lint guards (G1 sqlite3, G2 HMAC sentinels, G3 CORS wildcard)
        entry: scripts/ci/lint_guards.sh --staged
        language: system
        pass_filenames: false
        stages: [commit]
        verbose: true

      - id: btv-bandit-sast
        name: Bandit SAST (HIGH severity only, -lll)
        entry: bandit
        args: ["-r", "python/buildtovalue/", "-lll", "-q"]
        language: python
        additional_dependencies: ["bandit>=1.7.9"]
        pass_filenames: false
        stages: [commit]

      - id: btv-trufflehog-scan
        name: TruffleHog secret scan (requires trufflehog in PATH)
        entry: bash -c 'if command -v trufflehog >/dev/null 2>&1; then trufflehog git file://. --only-verified --since-commit HEAD --fail; else echo "SKIP: trufflehog not found — install from https://github.com/trufflesecurity/trufflehog"; fi'
        language: system
        pass_filenames: false
        stages: [commit]

      - id: btv-no-secrets-tracked
        name: Refuse to commit .env, *.db, *.key, *.crt, *.bin
        entry: |
          bash -c '
            files=$(git diff --cached --name-only --diff-filter=ACMR \
              | grep -E "^(.*/)?\.env$|\.db$|\.key$|\.crt$|\.pem$|\.bin$" \
              | grep -vE "(\.example|\.template)$" || true)
            if [ -n "$files" ]; then
              echo "Refusing to commit sensitive files:"
              echo "$files"
              echo "Add to .gitignore or move to .example/template form."
              exit 1
            fi
          '
        language: system
        pass_filenames: false
        stages: [commit]
