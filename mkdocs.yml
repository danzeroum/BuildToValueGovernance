site_name: BuildToValue Docs
site_description: Ética em IA em 5 minutos — governança, conformidade e contestabilidade para agentes de IA
site_url: https://docs.buildtovalue.io
repo_url: https://github.com/buildtovalue/buildtovalue
repo_name: buildtovalue/buildtovalue
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - autorefs
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: pt
          default: true
          name: Português (BR)
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Início: Home
            Quickstart: Quickstart
            Conceitos: Concepts
            Referência da API: API Reference
            Integrações: Integrations
            Visão geral: Overview
            Compliance: Compliance
            Changelog: Changelog
            Portal do Desenvolvedor: Developer Portal
            Tutoriais: Tutorials
            "01 — Tratando o Bloqueio": "01 — Handling the Block"
            "02 — Primeira Integração": "02 — First Integration"
            "03 — Verificação com btv-cli": "03 — Verification with btv-cli"
            "04 — Propor uma Política": "04 — Propose a Policy"
            "05 — Configuração VPS": "05 — VPS Setup"
            Anatomia da Evidência: Evidence Anatomy
            Fail-Secure: Fail-Secure
            ContestabilityLoop: ContestabilityLoop
            Dimensionamento Econômico: Economic Sizing
            Mapa Regulatório: Regulatory Map
            Mapa Operacional de YAMLs: Operational YAML Map
            Trilha de ADRs: ADR Trail
            Protocolo CAP: CAP Protocol
            Registro de Riscos: Risk Register
            "Referência Técnica (gerada)": "Technical Reference (generated)"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Quickstart: quickstart.md
  - Conceitos: concepts.md
  - Referência da API: api-reference.md
  - Integrações:
    - Visão geral: integrations/index.md
    - Python SDK: integrations/python-sdk.md
    - TypeScript SDK: integrations/typescript-sdk.md
    - LangChain: integrations/langchain.md
    - LlamaIndex: integrations/llamaindex.md
    - CrewAI: integrations/crewai.md
    - AutoGen: integrations/autogen.md
    - MCP Server: integrations/mcp.md
  - Compliance: compliance.md
  - Portal do Desenvolvedor:
    - Início: developer/index.md
    - Conceitos:
      - Anatomia da Evidência: developer/concepts/evidence-anatomy.md
      - Fail-Secure: developer/concepts/fail-secure.md
      - ContestabilityLoop: developer/concepts/contestability-loop.md
    - Tutoriais:
      - "01 — Tratando o Bloqueio": developer/tutorials/01-handle-failure.md
      - "02 — Primeira Integração": developer/tutorials/02-first-integration.md
      - "03 — Verificação com btv-cli": developer/tutorials/03-verify-evidence-cli.md
      - "04 — Propor uma Política": developer/tutorials/04-propose-policy.md
      - "05 — Configuração VPS": developer/tutorials/vps-environment-setup.md
    - Compliance:
      - Dimensionamento Econômico: developer/compliance/sizing-guide.md
      - Mapa Regulatório: developer/compliance/regulatory-map.md
      - Mapa Operacional de YAMLs: developer/compliance/dpo-ciso-yaml-map.md
    - Arquitetura UML (gerada): arquitetura-uml.md
    - Trilha de ADRs: developer/adr-trail/README.md
    - Protocolo CAP: developer/cap-protocol.md
    - Registro de Riscos: developer/RISK_REGISTER.md
    - Referência Técnica (gerada): developer/reference/index.md
  - Changelog: changelog.md

extra:
  alternate:
    - name: Português (BR)
      link: /
      lang: pt
    - name: English
      link: /en/
      lang: en
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/buildtovalue/buildtovalue
  analytics:
    provider: google
    property: G-XXXXXXXXXX
